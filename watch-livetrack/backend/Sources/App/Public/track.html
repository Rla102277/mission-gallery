<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live Track</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  html, body { margin: 0; height: 100%; font-family: -apple-system, system-ui, sans-serif; }
  #map { position: absolute; inset: 0; }
  #hud {
    position: absolute; top: 12px; left: 12px; right: 12px;
    background: rgba(255,255,255,0.92); border-radius: 12px;
    padding: 10px 14px; box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    z-index: 1000; display: flex; justify-content: space-between; align-items: center;
  }
  #title { font-weight: 600; }
  #status { font-size: 13px; color: #555; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .live { background: #2ecc71; box-shadow: 0 0 0 0 rgba(46,204,113,0.7); animation: pulse 1.6s infinite; }
  .ended { background: #888; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(46,204,113,0.7);} 70%{box-shadow:0 0 0 10px rgba(46,204,113,0);} 100%{box-shadow:0 0 0 0 rgba(46,204,113,0);} }
</style>
</head>
<body>
<div id="hud">
  <div><span id="title">Live Track</span></div>
  <div id="status"><span class="dot ended" id="dot"></span><span id="statusText">connecting…</span></div>
</div>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
  const token = location.pathname.split('/').filter(Boolean).pop();
  const map = L.map('map', { zoomControl: true }).setView([0, 0], 2);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  const path = L.polyline([], { color: '#e74c3c', weight: 4 }).addTo(map);
  const marker = L.circleMarker([0,0], { radius: 8, color: '#fff', weight: 2, fillColor: '#e74c3c', fillOpacity: 1 });
  let haveFix = false;
  let lastTs = null;
  let ended = false;

  async function loadMeta() {
    try {
      const r = await fetch(`/t/${token}/meta`);
      if (!r.ok) throw new Error('meta ' + r.status);
      const m = await r.json();
      document.getElementById('title').textContent = m.title || 'Live Track';
      if (m.endedAt) markEnded();
    } catch (e) {
      document.getElementById('statusText').textContent = 'unavailable';
    }
  }

  function markLive() {
    document.getElementById('dot').className = 'dot live';
    document.getElementById('statusText').textContent = 'live';
  }
  function markEnded() {
    ended = true;
    document.getElementById('dot').className = 'dot ended';
    document.getElementById('statusText').textContent = 'workout ended';
  }

  async function poll() {
    try {
      const url = `/t/${token}/pings` + (lastTs ? `?since=${encodeURIComponent(lastTs)}` : '');
      const r = await fetch(url);
      if (!r.ok) throw new Error('pings ' + r.status);
      const data = await r.json();
      const pings = data.pings || [];
      if (pings.length) {
        const latlngs = pings.map(p => [p.lat, p.lon]);
        latlngs.forEach(ll => path.addLatLng(ll));
        const last = latlngs[latlngs.length - 1];
        if (!haveFix) {
          marker.addTo(map);
          map.setView(last, 15);
          haveFix = true;
        } else {
          marker.setLatLng(last);
          map.panTo(last, { animate: true });
        }
        lastTs = pings[pings.length - 1].ts;
        if (!ended) markLive();
      } else if (!haveFix) {
        document.getElementById('statusText').textContent = 'waiting for first GPS fix…';
      }
      if (data.endedAt && !ended) markEnded();
    } catch (e) {
      document.getElementById('statusText').textContent = 'connection issue, retrying…';
    } finally {
      setTimeout(poll, ended ? 30000 : 4000);
    }
  }

  loadMeta();
  poll();
</script>
</body>
</html>
