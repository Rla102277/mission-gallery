<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TIA Admin</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f1110;--surface:#181b17;--surface2:#1d201c;
  --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.13);
  --cream:#ede9e2;--muted:rgba(237,233,226,.4);--dim:rgba(237,233,226,.18);
  --gold:#c9a227;--green:#5a9e6f;--red:#a05050;--sage:#3d4039;
  --font:"Helvetica Neue",Arial,sans-serif}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--cream);font-family:var(--font);font-size:13px}
button,input,select,textarea{font-family:var(--font)}a{color:var(--gold)}
/* AUTH */
#authScreen{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;align-items:center;justify-content:center}
.auth-box{width:340px}
.auth-logo{font-size:9px;letter-spacing:6px;text-transform:uppercase;color:var(--dim);margin-bottom:32px;display:block}
.auth-h{font-size:26px;font-weight:300;margin-bottom:28px;opacity:.8}
.auth-field{margin-bottom:14px}
.auth-field label{font-size:9px;letter-spacing:4px;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:6px}
.auth-field input{width:100%;padding:10px 14px;background:var(--surface);border:1px solid var(--border2);color:var(--cream);font-size:13px;outline:none}
.auth-btn{width:100%;margin-top:20px;padding:12px;background:var(--sage);border:none;color:var(--cream);font-size:9px;letter-spacing:5px;text-transform:uppercase;cursor:pointer}
.auth-err{color:var(--red);font-size:10px;letter-spacing:3px;text-transform:uppercase;margin-top:10px;display:none}
.auth-err.show{display:block}
/* SHELL */
#app{display:none;grid-template-rows:52px 1fr;height:100vh}
#app.show{display:grid}
/* TOPBAR */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--border);background:var(--surface)}
.tb-left{display:flex;align-items:center;gap:16px}
.tb-brand{font-size:9px;letter-spacing:5px;text-transform:uppercase;color:var(--dim)}
.tb-brand strong{color:var(--cream);opacity:.8}
.tb-sync{font-size:8px;letter-spacing:3px;text-transform:uppercase;color:var(--dim)}
.tb-sync.ok{color:var(--green)}.tb-sync.err{color:var(--red)}.tb-sync.busy{color:var(--gold)}
.tb-nav{display:flex;gap:1px}
.tb-tab{padding:8px 16px;font-size:8px;letter-spacing:4px;text-transform:uppercase;border:none;background:transparent;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tb-tab:hover{color:var(--cream)}.tb-tab.active{color:var(--cream);border-bottom-color:var(--gold)}
.tb-right{display:flex;gap:10px;align-items:center}
.tb-save{font-size:8px;letter-spacing:4px;text-transform:uppercase;border:none;background:var(--gold);color:#000;padding:6px 18px;font-weight:700;cursor:pointer}
.tb-save:disabled{opacity:.4;cursor:not-allowed}
.tb-signout{font-size:8px;letter-spacing:4px;text-transform:uppercase;border:1px solid var(--border);background:transparent;color:var(--muted);padding:5px 14px;cursor:pointer}
/* LAYOUT */
.body{display:flex;flex-direction:column;overflow:hidden;height:100%}
/* SIDEBAR — hidden, using inline gallery selector instead */
.sidebar{display:none}
.sb-group{padding:14px 0 4px}
.sb-lbl{font-size:8px;letter-spacing:5px;text-transform:uppercase;color:var(--dim);padding:0 14px 8px;display:block}
.sb-item{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:11px;margin:2px}
.sb-item:hover{color:var(--cream);background:rgba(255,255,255,.03);border-color:var(--border2)}
.sb-item.active{color:var(--cream);background:rgba(255,255,255,.05);border-color:var(--gold)}
.sb-num{font-size:8px;letter-spacing:2px;color:var(--dim);flex-shrink:0}
.sb-name{line-height:1.3}.sb-cnt{font-size:9px;color:var(--dim)}.sb-cnt.has{color:var(--green)}
.sb-div{display:none}
/* MAIN */
.main{display:flex;flex-direction:column;overflow:hidden;flex:1}
.ph{padding:16px 24px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:var(--surface2)}
.ph-eye{font-size:8px;letter-spacing:5px;text-transform:uppercase;color:var(--dim);margin-bottom:3px}
.ph-title{font-size:19px;font-weight:300}.ph-acts{display:flex;gap:8px}
.pb{flex:1;overflow-y:auto;padding:22px 24px}
/* BUTTONS */
.btn{padding:6px 16px;font-size:8px;letter-spacing:4px;text-transform:uppercase;border:1px solid var(--border2);background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap}
.btn:hover{color:var(--cream);border-color:rgba(255,255,255,.3)}
.btn.pri{background:var(--sage);border-color:var(--sage);color:var(--cream)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#000;font-weight:700}
.btn.red{border-color:rgba(160,80,80,.3);color:var(--red)}
.btn:disabled{opacity:.3;cursor:not-allowed}
/* INPUTS */
.input{width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--border2);color:var(--cream);font-size:13px;outline:none}
.textarea{width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--border2);color:var(--cream);font-size:12px;outline:none;resize:vertical;min-height:64px;line-height:1.6}
.field-lbl{font-size:8px;letter-spacing:4px;text-transform:uppercase;color:var(--dim);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.ai-wrap{position:relative;display:flex;align-items:stretch;gap:0}
.ai-wrap .input,.ai-wrap textarea.input{flex:1;border-top-right-radius:0;border-bottom-right-radius:0}
.ai-btn{width:34px;min-width:34px;padding:0;display:flex;align-items:center;justify-content:center;background:transparent;border:1px solid var(--border2);border-left:0;color:var(--gold);cursor:pointer;font-size:15px;transition:background .2s,color .2s;position:relative}
.ai-btn:hover{background:rgba(196,164,105,.12);color:var(--gold)}
.ai-btn.loading{pointer-events:none;opacity:.5}
.ai-btn.loading::after{content:"";width:12px;height:12px;border:2px solid var(--gold);border-top-color:transparent;border-radius:50%;animation:aispin .6s linear infinite;position:absolute}
@keyframes aispin{to{transform:rotate(360deg)}}
.ai-menu{position:absolute;right:0;top:100%;background:var(--surface2);border:1px solid var(--border);z-index:90;min-width:150px;display:none}
.ai-menu.show{display:block}
.ai-menu-item{padding:8px 14px;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);cursor:pointer;white-space:nowrap}
.ai-menu-item:hover{background:rgba(196,164,105,.1);color:var(--cream)}
.ai-menu-item .ai-mi-desc{font-size:9px;letter-spacing:0;text-transform:none;color:var(--dim);margin-top:2px}
.sec-lbl{font-size:8px;letter-spacing:5px;text-transform:uppercase;color:var(--dim);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.card{background:var(--surface2);border:1px solid var(--border);padding:18px;margin-bottom:14px}
/* PHOTO GRID */
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:5px}
.pc{position:relative;aspect-ratio:3/2;background:var(--surface2);border:2px solid transparent;overflow:hidden;cursor:pointer;border-radius:1px}
.pc:hover{border-color:rgba(255,255,255,.2)}.pc.cover{border-color:var(--green)!important}
.pc img{width:100%;height:100%;object-fit:cover;display:block}
.pc-badge{position:absolute;top:5px;left:5px;font-size:8px;letter-spacing:2px;text-transform:uppercase;padding:2px 6px;border-radius:1px}
.pc-badge.cover{background:var(--green);color:#fff}
.pc-ov{position:absolute;inset:0;background:rgba(0,0,0,0);display:flex;align-items:center;justify-content:center;gap:5px;opacity:0;transition:opacity .2s}
.pc:hover .pc-ov{opacity:1;background:rgba(0,0,0,.5)}
.pc-btn{padding:3px 9px;font-size:8px;letter-spacing:2px;text-transform:uppercase;border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.7);color:#fff;cursor:pointer}
.pc-lbl{position:absolute;bottom:0;left:0;right:0;padding:3px 5px;background:linear-gradient(to top,rgba(0,0,0,.85),transparent);font-size:8px;opacity:.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* SLOTS */
.slots{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.slot{background:var(--surface2);border:1px solid var(--border);overflow:hidden;cursor:pointer}
.slot:hover{border-color:var(--border2)}.slot.filled{border-color:rgba(90,158,111,.3)}
.slot-img{width:100%;aspect-ratio:16/7;object-fit:cover;display:block;background:var(--bg)}
.slot-empty{width:100%;aspect-ratio:16/7;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px}
.slot-empty-ico{font-size:20px;opacity:.12}.slot-empty-lbl{font-size:9px;letter-spacing:3px;text-transform:uppercase;opacity:.18}
.slot-info{padding:8px 12px 10px;display:flex;align-items:center;justify-content:space-between}
.slot-name{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--muted)}
.slot-act{font-size:8px;letter-spacing:3px;text-transform:uppercase;color:var(--dim)}.slot.filled .slot-act{color:var(--green)}
/* PORTFOLIO WORKS */
.pf-works{display:flex;flex-direction:column;gap:10px}
.pf-work-card{background:var(--surface2);border:1px solid var(--border);overflow:hidden}
.pf-work-card:hover{border-color:var(--border2)}
.pf-work-card.expanded{border-color:var(--gold)}
.pf-work-header{display:flex;gap:14px;cursor:pointer;padding:0}
.pf-work-cover{width:160px;min-height:100px;flex-shrink:0;background:var(--bg);overflow:hidden}
.pf-work-cover img{width:100%;height:100%;object-fit:cover;display:block}
.pf-work-cover .slot-empty{width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px}
.pf-work-body{flex:1;padding:12px 14px 12px 0;display:flex;flex-direction:column;justify-content:center;gap:4px}
.pf-work-title{font-size:14px;font-weight:500;color:var(--cream)}
.pf-work-sub{font-size:11px;color:var(--muted);font-style:italic}
.pf-work-meta{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--dim)}
.pf-work-actions{display:flex;gap:4px;margin-top:6px}
.pf-work-expand{padding:14px 18px;border-top:1px solid var(--border);display:none}
.pf-work-card.expanded .pf-work-expand{display:block}
.pf-work-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:5px;margin-top:10px}
.pf-work-photo{position:relative;aspect-ratio:3/2;background:var(--surface);overflow:hidden;border:2px solid transparent;border-radius:1px}
.pf-work-photo:hover{border-color:rgba(255,255,255,.2)}
.pf-work-photo.cover{border-color:var(--green)}
.pf-work-photo img{width:100%;height:100%;object-fit:cover;display:block}
.pf-work-photo-ov{position:absolute;inset:0;background:rgba(0,0,0,0);display:flex;align-items:center;justify-content:center;gap:4px;opacity:0;transition:opacity .2s}
.pf-work-photo:hover .pf-work-photo-ov{opacity:1;background:rgba(0,0,0,.5)}
.pf-work-photo-btn{padding:2px 8px;font-size:8px;letter-spacing:2px;text-transform:uppercase;border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.7);color:#fff;cursor:pointer}
.btn.sm{padding:3px 6px;font-size:10px;min-width:0}
/* CONTENT BLOCKS */
.cb-list{display:flex;flex-direction:column;gap:10px}
.cb-card{background:var(--surface2);border:1px solid var(--border);padding:16px;position:relative}
.cb-card:hover{border-color:var(--border2)}
.cb-actions{position:absolute;top:10px;right:10px;display:flex;gap:4px}
/* PICKER */
#picker{position:fixed;inset:0;z-index:800;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center}
#picker.open{display:flex}
.pk-box{background:var(--surface);border:1px solid var(--border2);width:min(920px,96vw);max-height:88vh;display:flex;flex-direction:column;border-radius:2px}
.pk-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.pk-eye{font-size:8px;letter-spacing:5px;text-transform:uppercase;color:var(--dim);margin-bottom:3px}
.pk-title{font-size:16px;font-weight:300}
.pk-close{font-size:20px;border:none;background:none;color:var(--muted);cursor:pointer}
.pk-filter{padding:10px 18px;border-bottom:1px solid var(--border);display:flex;gap:6px;flex-wrap:wrap;flex-shrink:0}
.pk-f{padding:4px 12px;font-size:8px;letter-spacing:3px;text-transform:uppercase;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer}
.pk-f:hover,.pk-f.active{background:rgba(255,255,255,.07);color:var(--cream);border-color:var(--border2)}
.pk-grid-wrap{overflow-y:auto;padding:14px 18px;flex:1}
.pk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:5px}
.pk-cell{position:relative;aspect-ratio:3/2;background:var(--surface2);overflow:hidden;cursor:pointer;border:2px solid transparent;border-radius:1px}
.pk-cell:hover{border-color:rgba(255,255,255,.3)}.pk-cell.active{border-color:var(--gold)}
.pk-cell img{width:100%;height:100%;object-fit:cover;display:block}
.pk-cell-lbl{position:absolute;bottom:0;left:0;right:0;padding:3px 5px;background:linear-gradient(to top,rgba(0,0,0,.85),transparent);font-size:8px;opacity:.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk-foot{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-shrink:0}
/* UPLOAD - full page */
.upload-page{display:grid;grid-template-rows:auto 1fr;height:100%;gap:0}
.upload-top{padding:20px 24px;border-bottom:1px solid var(--border);background:var(--surface2)}
.upload-top-row{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.upload-top-title{font-size:20px;font-weight:300;flex:1}
.upload-top-stats{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--dim)}
.upload-controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.upload-zone{border:2px dashed var(--border2);padding:40px 30px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s;flex:1;min-width:280px}
.upload-zone:hover,.upload-zone.drag{border-color:var(--gold);background:rgba(201,162,39,.04)}
.upload-zone-ico{font-size:28px;opacity:.15;margin-bottom:8px}
.upload-zone-lbl{font-size:9px;letter-spacing:4px;text-transform:uppercase;opacity:.35;margin-bottom:4px}
.upload-zone-sub{font-size:10px;opacity:.2}
.upload-series-pick{display:flex;flex-direction:column;gap:6px;min-width:220px}
.upload-bottom{overflow-y:auto;padding:20px 24px}
.upload-progress{margin-bottom:16px}
.upload-item{display:flex;align-items:center;gap:12px;padding:8px 12px;background:var(--surface2);border:1px solid var(--border);margin-bottom:4px}
.upload-item-name{flex:1;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upload-item-status{font-size:9px;letter-spacing:2px;text-transform:uppercase}
.upload-item-status.ok{color:var(--green)}.upload-item-status.err{color:var(--red)}.upload-item-status.busy{color:var(--gold)}
.upload-bar{height:3px;background:var(--border);margin-top:4px;border-radius:2px;overflow:hidden}
.upload-bar-fill{height:100%;background:var(--gold);transition:width .3s;width:0}
.upload-series-section{margin-bottom:24px}
.upload-series-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.upload-series-title{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--muted)}
.upload-series-cnt{font-size:9px;letter-spacing:2px;color:var(--dim)}
.cl-photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.cl-photo{position:relative;aspect-ratio:3/2;background:var(--surface2);overflow:hidden;border:2px solid transparent;border-radius:1px}
.cl-photo:hover{border-color:rgba(255,255,255,.15)}
.cl-photo img{width:100%;height:100%;object-fit:cover;display:block}
.cl-photo-lbl{position:absolute;bottom:0;left:0;right:0;padding:4px 6px;background:linear-gradient(to top,rgba(0,0,0,.85),transparent);font-size:9px;opacity:.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl-photo-del{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.2);color:var(--red);font-size:13px;cursor:pointer;display:none;align-items:center;justify-content:center;line-height:1}
.cl-photo:hover .cl-photo-del{display:flex}
.upload-empty{padding:60px 30px;text-align:center;border:1px solid var(--border);background:var(--surface2)}
.upload-empty-ico{font-size:36px;opacity:.08;margin-bottom:12px}
.upload-empty-lbl{font-size:9px;letter-spacing:5px;text-transform:uppercase;opacity:.2}
/* EXIF */
.exif-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.exif-tag{font-size:8px;letter-spacing:1px;color:var(--dim);background:rgba(255,255,255,.04);border:1px solid var(--border);padding:1px 6px;border-radius:1px;white-space:nowrap}
.pc-info{position:absolute;bottom:0;left:0;right:0;padding:5px 6px 4px;background:linear-gradient(to top,rgba(0,0,0,.9) 60%,transparent);display:flex;flex-direction:column;gap:2px}
.pc-name{font-size:9px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-exif{display:flex;gap:4px;flex-wrap:wrap}
.pc-exif span{font-size:7px;letter-spacing:.5px;color:rgba(237,233,226,.35)}
/* INLINE UPLOAD */
.gallery-upload{margin-bottom:18px;border:2px dashed var(--border2);padding:24px 20px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s}
.gallery-upload:hover,.gallery-upload.drag{border-color:var(--gold);background:rgba(201,162,39,.04)}
.gallery-upload-ico{font-size:22px;opacity:.12;margin-bottom:6px}
.gallery-upload-lbl{font-size:9px;letter-spacing:4px;text-transform:uppercase;opacity:.3;margin-bottom:3px}
.gallery-upload-sub{font-size:10px;opacity:.18}
/* IMAGES TAB */
.img-layout{display:flex;flex-direction:column;height:100%;overflow:hidden}
.img-folders{display:flex;flex-wrap:wrap;gap:4px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--surface)}
.img-folder-item{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:11px;white-space:nowrap}
.img-folder-item:hover{color:var(--cream);background:rgba(255,255,255,.03);border-color:var(--border2)}
.img-folder-item.active{color:var(--cream);background:rgba(255,255,255,.05);border-color:var(--gold)}
.img-folder-ico{font-size:12px;opacity:.4;flex-shrink:0;width:16px;text-align:center}
.img-folder-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.img-folder-cnt{font-size:9px;color:var(--dim)}
.img-folder-acts{display:flex;gap:2px;opacity:0;transition:opacity .15s}
.img-folder-item:hover .img-folder-acts{opacity:1}
.img-folder-del{border:none;background:none;color:var(--red);font-size:11px;cursor:pointer;padding:0 3px}
.img-new-folder{display:inline-flex;gap:6px;align-items:center}
.img-new-folder input{padding:4px 8px;background:var(--bg);border:1px solid var(--border2);color:var(--cream);font-size:11px;outline:none;width:120px}
.img-new-folder button{padding:4px 10px;font-size:8px;letter-spacing:2px;text-transform:uppercase;border:1px solid var(--border2);background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap}
.img-main{display:flex;flex-direction:column;overflow:hidden;flex:1}
.img-toolbar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--surface2)}
.img-toolbar-left{display:flex;align-items:center;gap:8px;flex:1}
.img-toolbar-right{display:flex;align-items:center;gap:8px}
.img-sel-count{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--dim)}
.img-content{flex:1;overflow-y:auto;padding:16px}
.img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.img-card{position:relative;aspect-ratio:3/2;background:var(--surface2);overflow:hidden;border:2px solid transparent;border-radius:1px;cursor:pointer}
.img-card:hover{border-color:rgba(255,255,255,.2)}
.img-card.selected{border-color:var(--gold)}
.img-card.in-series{border-color:rgba(90,158,111,.3)}
.img-card.selected.in-series{border-color:var(--gold)}
.img-card img{width:100%;height:100%;object-fit:cover;display:block}
.img-card-check{position:absolute;top:4px;left:4px;width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;font-size:10px;color:transparent;transition:all .15s}

<script>
// ═══════════════════════════════════════════════════════════════
// TIA-DATA.JS  v7
//
// Photo source: Cloudflare Images
// Config store: Server-side JSON (/api/config)
// ═══════════════════════════════════════════════════════════════

const TIA = {
  STORE_KEY:  'tia_admin',
  CF_HASH:    null,

  cfUrl(imageId, variant) {
    const hash = TIA.CF_HASH || TIA.getState().cf?.hash;
    if (!hash || !imageId) return '';
    return `https://imagedelivery.net/${hash}/${imageId}/${variant || 'public'}`;
  },

  photoUrl(id, size) {
    const variant = size === 'thumb' ? 'thumb' : size === 'cover' ? 'cover' : size === 'hero' ? 'hero' : 'full';
    return TIA.cfUrl(id, variant);
  },

  thumb(assetId)  { return TIA.photoUrl(assetId, 'thumb');  },
  cover(assetId)  { return TIA.photoUrl(assetId, 'cover'); },
  hero(assetId)   { return TIA.photoUrl(assetId, 'hero'); },
  full(assetId)   { return TIA.photoUrl(assetId, 'full');   },

  DEFAULT_SERIES: [
    { id:'s1', num:'01', title:'Solitude & Scale',          subtitle:'The Secret Lagoon',                  type:'Triptych', camera:'GFX 100S II + 32–64mm',  location:'Fjallsárlón Glacier Lagoon'          },
    { id:'s2', num:'02', title:'Glacial Contrasts',          subtitle:'Ice in Two Realms',                  type:'Diptych',  camera:'GFX 100S II + 100–200mm', location:'Jökulsárlón & Diamond Beach'         },
    { id:'s3', num:'03', title:'Blue Trilogy',               subtitle:'The Impossible Blues of Iceland Ice', type:'Triptych', camera:'X-E5 + GFX 100S II',      location:'Ice Cave · Diamond Beach · Jökulsárlón'},
    { id:'s4', num:'04', title:'Coastal Contrasts',          subtitle:'Black Sand vs Blue Water',            type:'Diptych',  camera:'GFX 100S II',              location:'Reynisfjara · Blue Lagoon'           },
    { id:'s5', num:'05', title:'The Human Element',          subtitle:'Presence at the Edge of the World',   type:'Diptych',  camera:'GFX 100S II',              location:'South Iceland Plains'                },
    { id:'s6', num:'06', title:'Arnarstapi Geometry',        subtitle:'The Architecture of Erosion',         type:'Triptych', camera:'GFX 100S II + 32–64mm',  location:'Arnarstapi, Snæfellsnes'             },
    { id:'s7', num:'07', title:'Peninsular Panorama',        subtitle:'Snæfellsnes in Three Moods',          type:'Triptych', camera:'GFX 100S II + 32–64mm',  location:'Snæfellsnes Peninsula'               },
    { id:'s8', num:'08', title:'Urban Odyssey',              subtitle:'Reykjavík as Coda',                   type:'Triptych', camera:'GFX 100S II + 32–64mm',  location:'Reykjavík'                           },
  ],

  _state: null,

  async load() {
    try {
      const res = await fetch('/api/config?t=' + Date.now());
      if (res.ok) {
        const data = await res.json();
        if (data && Object.keys(data).length > 0) {
          TIA._state = data;
          localStorage.setItem(TIA.STORE_KEY, JSON.stringify(TIA._state));
          return TIA._state;
        }
      }
    } catch {}
    try {
      const cached = localStorage.getItem(TIA.STORE_KEY);
      if (cached) { TIA._state = JSON.parse(cached); return TIA._state; }
    } catch {}
    TIA._state = {};
    return TIA._state;
  },

  getState() {
    if (TIA._state) return TIA._state;
    try { return JSON.parse(localStorage.getItem(TIA.STORE_KEY) || '{}'); }
    catch { return {}; }
  },

  async save(state) {
    TIA._state = state;
    localStorage.setItem(TIA.STORE_KEY, JSON.stringify(state));
    const res = await fetch('/api/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(state),
    });
    if (!res.ok) throw new Error('Config save failed: ' + await res.text());
    const result = await res.json();
    if (result.timestamp) {
      localStorage.setItem('tia_last_save', result.timestamp);
    }
  },

  getSeries() {
    const state = TIA.getState();
    const defaults = TIA.DEFAULT_SERIES.map(s => ({ ...s, ...(state.series?.[s.id] || {}) }));
    const customIds = Object.keys(state.series || {}).filter(id => !TIA.DEFAULT_SERIES.find(d => d.id === id));
    const custom = customIds.map(id => ({ id, ...state.series[id] })).filter(s => s.title);
    return [...defaults, ...custom];
  },

  getPhotos(seriesId) {
    const state = TIA.getState();
    return (state.photos?.[seriesId] || []).map(aid => ({
      assetId:  aid,
      thumb:    TIA.thumb(aid),
      full:     TIA.full(aid),
      cover:    TIA.cover(aid),
      hero:     TIA.hero(aid),
      filename: state.cf?.assetMeta?.[aid]?.filename || aid.split('/').pop() || aid,
    }));
  },

  getCoverUrl(seriesId, size = 'cover') {
    const state    = TIA.getState();
    const adminAid = state.series?.[seriesId]?.coverAssetId;
    if (adminAid) return TIA[size]?.(adminAid) || '';
    const photos   = TIA.getPhotos(seriesId);
    return photos[0]?.[size] || photos[0]?.cover || '';
  },

  getHomeUrl(slotId, size = 'hero') {
    const aid = TIA.getState().home?.[slotId];
    return aid ? (TIA[size]?.(aid) || '') : '';
  },

  getPortfolioUrl(pfKey, size = 'cover') {
    const aid = TIA.getState().portfolio?.[pfKey];
    return aid ? (TIA[size]?.(aid) || '') : '';
  },

  applyAll() {
    document.querySelectorAll('[data-tia]').forEach(el => {
      const slot = el.dataset.tia;
      const ctx  = el.dataset.tiaCtx  || 'home';
      const size = el.dataset.tiaSize || (el.tagName === 'IMG' ? 'cover' : 'hero');
      let url = '';
      if (ctx === 'home')      url = TIA.getHomeUrl(slot, size);
      if (ctx === 'portfolio') url = TIA.getPortfolioUrl(slot, size);
      if (ctx === 'series')    url = TIA.getCoverUrl(slot, size);
      if (!url) return;
      if (el.tagName === 'IMG') el.src = url;
      else el.style.backgroundImage = `url('${url}')`;
    });
  },
};


// AUTH
// AUTH
let authed = sessionStorage.getItem("tia_auth") === "1";
var ADMIN_PIN = "tia2026";

function doLogin() {
  const p = document.getElementById("authPass").value;
  const lp = p.toLowerCase();
  if (lp === "tia2026" || lp === "tai2026") {
    sessionStorage.setItem("tia_auth","1");
    authed = true;
    document.getElementById("authScreen").style.display = "none";
    document.getElementById("app").classList.add("show");
    init();
  } else {
    document.getElementById("authErr").classList.add("show");
    document.getElementById("authPass").value = "";
    document.getElementById("authPass").focus();
  }
}

function doLogout() { sessionStorage.removeItem("tia_auth"); location.reload(); }

if (authed) {
  document.getElementById("authScreen").style.display = "none";
  document.getElementById("app").classList.add("show");
}

// STATE
let STATE={};
let activeView=null,activeTab="upload";
let CF_PHOTOS={};

function getSeries(){return TIA.getSeries();}
function getPhotoMeta(aid){
  const cf=CF_PHOTOS[aid]||STATE.cf?.assetMeta?.[aid];
  if(cf) return{filename:cf.filename||aid,thumbUrl:TIA.cfUrl(aid,'thumb'),fullUrl:TIA.cfUrl(aid,'full')};
  return{filename:aid.split('/').pop()||aid,thumbUrl:"",fullUrl:""};
}
function getSeriesPhotos(sid){
  return(STATE.photos?.[sid]||[]).map(aid=>{
    const m=getPhotoMeta(aid);
    return{assetId:aid,filename:m.filename,thumbUrl:m.thumbUrl,fullUrl:m.fullUrl};
  });
}
function allPhotos(){
  const seen=new Set();
  const all=[];
  function add(aid){
    if(!aid||seen.has(aid))return;
    seen.add(aid);
    const m=getPhotoMeta(aid);
    all.push({assetId:aid,filename:m.filename,urlThumb:m.thumbUrl,url2048:m.fullUrl});
  }
  Object.values(STATE.photos||{}).forEach(ids=>ids.forEach(add));
  Object.keys(CF_PHOTOS||{}).forEach(add);
  Object.keys(STATE.cf?.assetMeta||{}).forEach(add);
  (STATE.portfolioWorks||[]).forEach(w=>(w.galleries||[]).forEach(g=>(g.photos||[]).forEach(add)));
  imgAllImages.forEach(img=>add(img.id));
  return all;
}

// INIT
async function init(){
  setSyncStatus("busy","Loading...");
  if(typeof BlockRenderer==='undefined'){
    await new Promise(function(resolve){
      var s=document.createElement('script');
      s.src='/assets/js/block-renderer.js';
      s.onload=resolve;
      s.onerror=resolve;
      document.head.appendChild(s);
    });
  }
  STATE=await TIA.load();
  STATE.series=STATE.series||{};STATE.photos=STATE.photos||{};
  STATE.home=STATE.home||{};
  STATE.cf=STATE.cf||{};STATE.cf.assetMeta=STATE.cf.assetMeta||{};
  STATE.imgFolders=STATE.imgFolders||{};
  delete STATE.portfolioEntries;
  delete STATE.portfolio;
  delete STATE.portfolioPhotos;
  delete STATE.cl;
  delete STATE.lr;
  Object.assign(CF_PHOTOS,STATE.cf.assetMeta);
  const hadHash=!!STATE.cf.hash;
  try{const cfgRes=await fetch("/api/images/config");const cfg=await cfgRes.json();if(cfg.hash){TIA.CF_HASH=cfg.hash;STATE.cf.hash=cfg.hash;}}catch{}
  if(TIA.CF_HASH&&!hadHash){await TIA.save(STATE);console.log("[Admin] Auto-saved CF hash to config");}
  setSyncStatus("ok","Synced");
  switchTab("portfolio");
  try{
    const listRes=await fetch("/api/images/list");
    if(listRes.ok){
      const listData=await listRes.json();
      imgAllImages=listData.images||[];
      if(listData.hash)TIA.CF_HASH=listData.hash;
      imgAllImages.forEach(img=>{

async function handleUploadFiles(files,sid){
  if(!sid)return toast("No series selected",true);
  const progress=document.getElementById("uploadProgress");
  if(!STATE.photos[sid])STATE.photos[sid]=[];
  let uploaded=0;
  const total=Array.from(files).filter(f=>f.type.startsWith("image/")).length;
  if(!total)return toast("No image files selected",true);
  if(progress)progress.innerHTML=`<div class="upload-item"><span class="upload-item-name">Uploading ${total} file${total>1?"s":""}...</span><span class="upload-item-status busy">0 / ${total}</span></div><div class="upload-bar"><div class="upload-bar-fill" id="uploadBarFill"></div></div>`;
  for(const file of files){
    if(!file.type.startsWith("image/"))continue;
    try{
      const fd=new FormData();
      fd.append("file",file);
      const res=await fetch("/api/images/upload",{method:"POST",body:fd});
      if(!res.ok){const errData=await res.json().catch(()=>({}));throw new Error(errData.error||"Upload failed: "+res.status);}
      const data=await res.json();
      const cfId=data.id;
      const meta={id:cfId,filename:data.filename||file.name};
      if(data.exif&&Object.keys(data.exif).length>0)meta.exif=data.exif;
      if(!STATE.cf)STATE.cf={assetMeta:{}};
      if(!STATE.cf.assetMeta)STATE.cf.assetMeta={};
      STATE.cf.assetMeta[cfId]=meta;
      CF_PHOTOS[cfId]=meta;
      if(!STATE.photos[sid].includes(cfId))STATE.photos[sid].push(cfId);
      uploaded++;
      const bar=document.getElementById("uploadBarFill");
      if(bar)bar.style.width=Math.round((uploaded/total)*100)+"%";
      const statusEl=progress?.querySelector(".upload-item-status");
      if(statusEl){statusEl.textContent=uploaded+" / "+total;if(uploaded===total)statusEl.className="upload-item-status ok";}
      const nameEl=progress?.querySelector(".upload-item-name");
      if(nameEl)nameEl.textContent=file.name;
    }catch(err){
      if(progress)progress.innerHTML+=`<div class="upload-item"><span class="upload-item-name">${esc(file.name)}</span><span class="upload-item-status err">${esc(err.message)}</span></div>`;
    }
  }
  if(uploaded>0){
    setTimeout(()=>showPortfolioPanel(),1500);
    toast(uploaded+" photo"+(uploaded>1?"s":"")+" uploaded - Save & Publish to go live");
  }
}

// SERIES VIEW
function formatExposure(t){if(!t)return"";if(t>=1)return t+"s";const d=Math.round(1/t);return"1/"+d;}
function exifTags(aid){
  const meta=CF_PHOTOS[aid]||STATE.cf?.assetMeta?.[aid];
  if(!meta?.exif)return"";
  const e=meta.exif;const tags=[];
  if(e.make&&e.model){const m=e.model.startsWith(e.make)?e.model:`${e.make} ${e.model}`;tags.push(m);}
  else if(e.model)tags.push(e.model);
  if(e.lens)tags.push(e.lens);
  if(e.focalLength)tags.push(Math.round(e.focalLength)+"mm");
  if(e.fNumber)tags.push("f/"+e.fNumber);
  if(e.exposureTime)tags.push(formatExposure(e.exposureTime));
  if(e.iso)tags.push("ISO "+e.iso);
  if(e.dateTime){try{const d=new Date(e.dateTime);tags.push(d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}));}catch{}}
  return tags.map(t=>`<span>${esc(t)}</span>`).join("");
}

    photos.forEach(p=>{

function blockPreview(b){
  var d=b.data||{};
  if(b.type==='hero') return d.title||d.tagline||d.variant||'Hero';
  if(b.type==='text') return d.heading||(d.body||'').substring(0,60)||d.line1||'Text';
  if(b.type==='divider') return '— ✦ —';
  if(b.type==='collections-grid') return d.heading||'Collections Grid';
  if(b.type==='featured-list') return d.heading||'Featured List';
  if(b.type==='process-grid') return d.heading||'Process Grid';
  if(b.type==='callout') return d.title||'Callout';
  if(b.type==='services-grid') return d.heading||'Services';
  if(b.type==='newsletter') return d.heading||'Newsletter';
  if(b.type==='quote') return (d.text||'').substring(0,60)||'Quote';
  if(b.type==='stats-bar') return (d.items||[]).map(function(it){return it.value;}).join(' | ')||'Stats';
  if(b.type==='image-text') return d.heading||'Image + Text';
  if(b.type==='photo-grid') return (d.photos||[]).length+' photos';
  if(b.type==='back-link') return d.text||'Back Link';
  if(b.type==='badge') return d.text||'Badge';
  if(b.type==='details-list') return (d.items||[]).join(', ').substring(0,60)||'Details';
  if(b.type==='email-link') return d.email||'Email';
  if(b.type==='purpose-quote') return (d.text||'').substring(0,60)||'Purpose';
  return b.type;
}

function toggleBlockEditor(idx){

function moveBlock(idx,dir){
  var blocks=getPageBlocks(activePage);
  var target=idx+dir;
  if(target<0||target>=blocks.length)return;
  var tmp=blocks[idx];blocks[idx]=blocks[target];blocks[target]=tmp;
  if(editingBlockIdx===idx)editingBlockIdx=target;
  else if(editingBlockIdx===target)editingBlockIdx=idx;
  showPagesPanel(true);
}

function duplicateBlock(idx){
  var blocks=getPageBlocks(activePage);
  var copy=JSON.parse(JSON.stringify(blocks[idx]));
  copy.id=copy.type.replace(/-/g,'')+'-'+Date.now();
  blocks.splice(idx+1,0,copy);
  editingBlockIdx=idx+1;
  showPagesPanel(true);
  toast("Block duplicated");
}

function removeBlock(idx){
  var blocks=getPageBlocks(activePage);
  if(!confirm("Delete this "+blocks[idx].type+" block?"))return;
  blocks.splice(idx,1);
  if(editingBlockIdx===idx)editingBlockIdx=null;
  else if(editingBlockIdx!==null&&editingBlockIdx>idx)editingBlockIdx--;
  showPagesPanel(true);
  toast("Block removed");
}

function updateBlockData(idx,field,val){
  var blocks=getPageBlocks(activePage);
  if(!blocks[idx])return;
  blocks[idx].data[field]=val;
}

function updateBlockItemField(idx,itemIdx,field,val){
  var blocks=getPageBlocks(activePage);
  if(!blocks[idx]||!blocks[idx].data.items)return;
  blocks[idx].data.items[itemIdx][field]=val;
}

function addBlockItem(idx,template){
  var blocks=getPageBlocks(activePage);
  if(!blocks[idx])return;
  if(!blocks[idx].data.items)blocks[idx].data.items=[];
  blocks[idx].data.items.push(typeof template==='string'?'':JSON.parse(JSON.stringify(template)));
  showPagesPanel();
}

function removeBlockItem(idx,itemIdx){
  var blocks=getPageBlocks(activePage);
  if(!blocks[idx]||!blocks[idx].data.items)return;
  blocks[idx].data.items.splice(itemIdx,1);
  showPagesPanel();
}

function updateBlockDetailItem(idx,itemIdx,val){
  var blocks=getPageBlocks(activePage);
  if(!blocks[idx]||!blocks[idx].data.items)return;
  blocks[idx].data.items[itemIdx]=val;
}

      if(thumb) html+='<img src="'+thumb+'" alt="" loading="lazy">';
      else html+='<div class="slot-empty"><div class="slot-empty-ico">[+]</div><div class="slot-empty-lbl">Cover</div></div>';
      html+='</div>';
      html+='<div class="pf-work-body">';
      html+='<div class="pf-work-title">'+esc(w.title||"Untitled")+'</div>';
      html+='<div class="pf-work-sub">'+esc(w.subtitle||"")+'</div>';
      html+='<div class="pf-work-meta">'+esc(w.type||"Series")+' &middot; '+esc(w.location||"")+' &middot; '+galCount+' collection'+(galCount===1?'':'s')+(featThumb?' &middot; Featured &#10004;':'')+'</div>';
      html+='<div class="pf-work-actions" onclick="event.stopPropagation()">';
      var isEditing=editingWorkIdx===i;
      html+='<button class="btn'+(isEditing?' pri':'')+'" onclick="editPortfolioWork('+i+')" data-testid="btn-edit-work-'+i+'">'+(isEditing?'Done':'Edit')+'</button>';

      if(i<works.length-1) html+='<button class="btn sm" onclick="movePortfolioWork('+i+',1)" data-testid="btn-move-work-down-'+i+'">&#8595;</button>';
      html+='<button class="btn sm red" onclick="removePortfolioWork('+i+')" data-testid="btn-remove-work-'+i+'">&#x2715;</button>';
      html+='</div></div></div>';

        html+=renderWorkEditor(w,i);

      if(isExpanded){
        html+=renderWorkGalleries(w,i);
      }
      html+='</div></div>';
    });
    html+='</div>';
  }
  var series=getSeries();
  var standaloneGals=series.filter(function(s){return !isGalleryInWork(s.id);});
  if(standaloneGals.length||Object.keys(STATE.series||{}).length){
    html+='<div style="margin-top:24px;padding-top:18px;border-top:1px solid var(--border)">';

      var sid=activeView;
      var s=series.find(function(x){return x.id===sid;});
      var photos=getSeriesPhotos(sid);
      var cover=STATE.series?.[sid]?.coverAssetId||photos[0]?.assetId;
      var isCustom=!TIA.DEFAULT_SERIES.find(function(d){return d.id===sid;});
      html+=renderSeriesContent(sid,s,photos,cover,isCustom);
    }
    html+='</div>';
  }
  document.getElementById("panelBody").innerHTML=html;
}
function isGalleryInWork(seriesId){
  var works=getPortfolioWorks();
  for(var i=0;i<works.length;i++){
    var gals=works[i].galleries||[];
    for(var j=0;j<gals.length;j++){
      if(gals[j].legacySeriesId===seriesId)return true;
    }
  }
  return false;
}

function toggleFolderEditor(workIdx,galIdx,folderIdx){

  showPortfolioPanel(true);
}

function addFolderToGallery(workIdx,galIdx){
  var w=getPortfolioWorks()[workIdx];
  if(!w||!w.galleries[galIdx])return;
  if(!w.galleries[galIdx].folders)w.galleries[galIdx].folders=[];
  w.galleries[galIdx].folders.push({id:'fld-'+Date.now(),title:'New Folder',coverAssetId:'',photos:[]});
  var fi=w.galleries[galIdx].folders.length-1;
  editingFolder=workIdx+'__'+galIdx+'__'+fi;
  showPortfolioPanel(true);
  saveAll();
  toast('Folder added');
}

function updateFolder(workIdx,galIdx,folderIdx,field,val){
  var w=getPortfolioWorks()[workIdx];
  if(!w||!w.galleries[galIdx]||!w.galleries[galIdx].folders||!w.galleries[galIdx].folders[folderIdx])return;
  w.galleries[galIdx].folders[folderIdx][field]=val;
}

function removeFolder(workIdx,galIdx,folderIdx){
  var w=getPortfolioWorks()[workIdx];
  if(!w||!w.galleries[galIdx]||!w.galleries[galIdx].folders)return;
  if(!confirm('Remove this folder and all its photos?'))return;
  w.galleries[galIdx].folders.splice(folderIdx,1);
  editingFolder=null;
  showPortfolioPanel(true);
  saveAll();
  toast('Folder removed');
}

function moveFolder(workIdx,galIdx,folderIdx,dir){
  var w=getPortfolioWorks()[workIdx];
  if(!w||!w.galleries[galIdx]||!w.galleries[galIdx].folders)return;
  var arr=w.galleries[galIdx].folders;
  var newIdx=folderIdx+dir;
  if(newIdx<0||newIdx>=arr.length)return;
  var temp=arr[folderIdx];arr[folderIdx]=arr[newIdx];arr[newIdx]=temp;
  editingFolder=null;
  showPortfolioPanel(true);
  saveAll();
}

function setFolderCover(workIdx,galIdx,folderIdx,assetId){
  var w=getPortfolioWorks()[workIdx];
  if(!w||!w.galleries[galIdx]||!w.galleries[galIdx].folders||!w.galleries[galIdx].folders[folderIdx])return;
  w.galleries[galIdx].folders[folderIdx].coverAssetId=assetId;
  showPortfolioPanel(true);
  saveAll();
  toast('Folder cover set');
}

function removeFolderPhoto(workIdx,galIdx,folderIdx,photoIdx){
  var w=getPortfolioWorks()[workIdx];
  if(!w||!w.galleries[galIdx]||!w.galleries[galIdx].folders||!w.galleries[galIdx].folders[folderIdx])return;
  w.galleries[galIdx].folders[folderIdx].photos.splice(photoIdx,1);
  showPortfolioPanel(true);
  saveAll();
}

function movePhotoToFolder(workIdx,galIdx,photoIdx){
  var w=getPortfolioWorks()[workIdx];
  if(!w||!w.galleries[galIdx])return;
  var g=w.galleries[galIdx];
  var folders=g.folders||[];
  if(!folders.length){toast('No folders yet');return;}
  var choice=prompt('Move photo to which folder?\\n'+folders.map(function(f,fi){return (fi+1)+'. '+(f.title||'Untitled');}).join('\\n')+'\\n\\nEnter number:');
  if(!choice)return;
  var fi=parseInt(choice,10)-1;
  if(isNaN(fi)||fi<0||fi>=folders.length)return;
  var pid=g.photos[photoIdx];
  if(!pid)return;
  g.photos.splice(photoIdx,1);
  if(!folders[fi].photos)folders[fi].photos=[];
  folders[fi].photos.push(pid);
  showPortfolioPanel(true);
  saveAll();
  toast('Photo moved to '+esc(folders[fi].title||'folder'));
}

async function uploadToFolder(files,workIdx,galIdx,folderIdx){
  if(!files||!files.length)return;
  var w=getPortfolioWorks()[workIdx];
  if(!w||!w.galleries[galIdx]||!w.galleries[galIdx].folders||!w.galleries[galIdx].folders[folderIdx])return;
  var prog=document.getElementById('fuUploadProgress_'+workIdx+'_'+galIdx+'_'+folderIdx);
  var total=files.length,done=0;
  if(prog)prog.innerHTML='<div style="font-size:10px;opacity:.5">Uploading 0/'+total+'...</div>';
  for(var i=0;i<files.length;i++){
    var fd=new FormData();fd.append('file',files[i]);
    try{
      var res=await fetch('/api/images/upload',{method:'POST',body:fd});
      if(res.ok){
        var data=await res.json();
        if(data.id){

async function runAi(type,idx,field,mode){
  closeAllAiMenus();
  var w=type==='work'?getPortfolioWorks()[idx]:null;
  var context,current,actualField=field;
  var gal=null,folder=null,wIdx,gIdx,fIdx;
  if(type==='series'){
    var parts=field.split('__');
    actualField=parts[0];
    var seriesId=parts[1];
    var s=STATE.series?.[seriesId]||{};
    context={title:s.title||'',type:s.type||'',location:s.location||'',camera:s.camera||'',subtitle:s.subtitle||''};
    current=s[actualField]||'';
  } else if(type==='gal'){
    wIdx=Math.floor(idx/1000);
    gIdx=idx%1000;
    var works=getPortfolioWorks();
    w=works[wIdx];
    gal=(w&&w.galleries)?w.galleries[gIdx]:null;
    context={title:w?w.title:'',type:w?w.type:'',location:gal?gal.location||w.location:'',camera:gal?gal.camera||w.camera:'',subtitle:gal?gal.subtitle:''};
    current=gal?gal[actualField]||'':'';
  } else if(type==='folder'){
    wIdx=Math.floor(idx/1000000);
    gIdx=Math.floor((idx%1000000)/1000);
    fIdx=idx%1000;
    var works2=getPortfolioWorks();
    w=works2[wIdx];
    gal=(w&&w.galleries)?w.galleries[gIdx]:null;
    folder=(gal&&gal.folders)?gal.folders[fIdx]:null;
    if(!folder)return;
    context={title:folder.title||'',type:folder.type||w?.type||'',location:folder.location||gal?.location||w?.location||'',camera:folder.camera||gal?.camera||w?.camera||'',subtitle:folder.subtitle||'',parentWork:w?.title||'',parentGallery:gal?.title||''};
    current=folder[actualField]||'';
  } else if(type==='block'){
    var blocks=getPageBlocks(activePage);
    var blk=blocks[idx];
    if(!blk)return;
    var bd=blk.data||{};
    context={blockType:blk.type,page:activePage,title:bd.title||bd.heading||'',subtitle:bd.subtitle||'',eyebrow:bd.eyebrow||'',body:bd.body||''};
    current=bd[actualField]||'';
  } else if(type==='page'){
    var pg=STATE.pages&&STATE.pages[activePage]?STATE.pages[activePage]:{};
    context={page:activePage,title:pg.title||'',metaDescription:pg.metaDescription||''};
    current=pg[actualField]||'';
  } else {
    if(!w)return;
    context={title:w.title||'',type:w.type||'',location:w.location||'',camera:w.camera||'',subtitle:w.subtitle||''};
    current=w[actualField]||'';
  }
  if(mode!=='generate'&&!current.trim()){mode='generate';}
  var btnId=aiFieldId(type,idx,field)+'-btn';
  var btn=document.getElementById(btnId);
  if(btn){btn.classList.add('loading');btn.innerHTML='';}
  try{
    var resp=await fetch('/api/ai/enrich',{
      method:'POST',
      headers:{'Content-Type':'application/json','X-Admin-Pin':ADMIN_PIN},
      body:JSON.stringify({field:actualField,current:current,context:context,mode:mode})
    });
    var data=await resp.json();
    if(data.error){toast(data.error,true);return;}
    if(type==='work'){
      w[actualField]=data.text;
      var input=document.querySelector('[data-testid="input-work-'+actualField+'-'+idx+'"]');
      if(input){if(input.tagName==='TEXTAREA')input.value=data.text;else input.value=data.text;}
    } else if(type==='gal'&&gal){
      gal[actualField]=data.text;
      var input=document.querySelector('[data-testid="input-gal-'+actualField+'-'+wIdx+'-'+gIdx+'"]');
      if(input){if(input.tagName==='TEXTAREA')input.value=data.text;else input.value=data.text;}
    } else if(type==='series'){
      if(STATE.series&&STATE.series[seriesId])STATE.series[seriesId][actualField]=data.text;
      var input=document.querySelector('[data-testid="input-series-'+actualField+'-'+seriesId+'"]');
      if(input){if(input.tagName==='TEXTAREA')input.value=data.text;else input.value=data.text;}
    } else if(type==='folder'&&folder){
      folder[actualField]=data.text;
      var input=document.querySelector('[data-testid="input-folder-'+actualField+'-'+wIdx+'-'+gIdx+'-'+fIdx+'"]');
      if(input){if(input.tagName==='TEXTAREA')input.value=data.text;else input.value=data.text;}
    } else if(type==='block'){
      if(!blk.data)blk.data={};
      blk.data[actualField]=data.text;
      var input=document.querySelector('[data-testid="input-bl-'+actualField+'-'+idx+'"]');
      if(input){if(input.tagName==='TEXTAREA')input.value=data.text;else input.value=data.text;}
    } else if(type==='page'){
      if(!STATE.pages[activePage])STATE.pages[activePage]={};
      STATE.pages[activePage][actualField]=data.text;
      var testId=actualField==='title'?'input-page-title':'input-page-meta';
      var input=document.querySelector('[data-testid="'+testId+'"]');
      if(input){input.value=data.text;}
    }
    toast('AI: '+actualField+' updated');
  }catch(err){
    toast('AI error: '+err.message,true);
  }finally{
    if(btn){btn.classList.remove('loading');btn.innerHTML='&#10024;';}
  }
}

async function uploadToGallery(files,workIdx,galIdx){
  var w=getPortfolioWorks()[workIdx];
  if(!w||!w.galleries||!w.galleries[galIdx])return;
  var g=w.galleries[galIdx];
  if(!g.photos)g.photos=[];
  var progress=document.getElementById("geUploadProgress_"+workIdx+"_"+galIdx);
  var total=Array.from(files).filter(function(f){return f.type.startsWith("image/");}).length;
  if(!total)return toast("No image files",true);
  var uploaded=0;
  if(progress)progress.innerHTML='<div class="upload-item"><span class="upload-item-name">Uploading '+total+' file'+(total>1?'s':'')+'...</span><span class="upload-item-status busy">0 / '+total+'</span></div><div class="upload-bar"><div class="upload-bar-fill" id="geBar_'+workIdx+'_'+galIdx+'"></div></div>';
  for(var fi=0;fi<files.length;fi++){
    var file=files[fi];
    if(!file.type.startsWith("image/"))continue;
    try{
      var fd=new FormData();fd.append("file",file);
      var res=await fetch("/api/images/upload",{method:"POST",body:fd});
      if(!res.ok)throw new Error("Upload failed");
      var data=await res.json();
      var cfId=data.id;
      var meta={id:cfId,filename:data.filename||file.name};
      if(data.exif&&Object.keys(data.exif).length>0)meta.exif=data.exif;
      if(!STATE.cf)STATE.cf={assetMeta:{}};
      if(!STATE.cf.assetMeta)STATE.cf.assetMeta={};
      STATE.cf.assetMeta[cfId]=meta;
      CF_PHOTOS[cfId]=meta;
      if(!g.photos.includes(cfId))g.photos.push(cfId);
      uploaded++;
      var bar=document.getElementById("geBar_"+workIdx+"_"+galIdx);
      if(bar)bar.style.width=Math.round((uploaded/total)*100)+"%";
    }catch(err){
      if(progress)progress.innerHTML+='<div class="upload-item"><span class="upload-item-name">'+esc(file.name)+'</span><span class="upload-item-status err">'+esc(err.message)+'</span></div>';
    }
  }
  if(uploaded>0){
    setTimeout(function(){showPortfolioPanel(true);},1000);

function toggleNavVis(idx){
  var nav=getNavigation();
  nav[idx].visible=!nav[idx].visible;
  showSettingsPanel();
}
function moveNav(idx,dir){
  var nav=getNavigation();
  var target=idx+dir;
  if(target<0||target>=nav.length)return;
  var tmp=nav[idx];nav[idx]=nav[target];nav[target]=tmp;
  showSettingsPanel();
}
function removeNav(idx){
  var nav=getNavigation();
  nav.splice(idx,1);
  showSettingsPanel();
}
function addNav(){
  var nav=getNavigation();
  nav.push({label:'New Page',href:'/',visible:true});
  showSettingsPanel();
}

function testCfConnection(){
  var statusEl=document.getElementById("cfStatus");
  if(!statusEl)return;
  statusEl.innerHTML='<span style="color:var(--gold)">Testing...</span>';
  fetch("/api/images/list").then(function(res){
    if(res.ok){
      statusEl.innerHTML='<span style="color:var(--green)">Connected</span>';
      toast("Cloudflare connection successful");
    } else {
      statusEl.innerHTML='<span style="color:var(--red)">Not Connected (HTTP '+res.status+')</span>';
      toast("Connection failed",true);
    }
  }).catch(function(err){
    statusEl.innerHTML='<span style="color:var(--red)">Not Connected</span>';
    toast("Connection failed: "+err.message,true);
  });
}

let pkSlotId=null,pkCtx=null,pkActive=null;
async function openPicker(slotId,ctx,label){

function closePicker(){document.getElementById("picker").classList.remove("open");}
function renderPkFilter(){

    getSeries().map(s=>`<button class="pk-f" onclick="renderPkGrid('${s.id}');setActivePkF(this)">${s.num} ${s.title}</button>`).join("");
}
function setActivePkF(btn){document.querySelectorAll(".pk-f").forEach(b=>b.classList.remove("active"));btn.classList.add("active");}
function renderPkGrid(filterSid){
  const photos=filterSid?getSeriesPhotos(filterSid).map(p=>({assetId:p.assetId,thumbUrl:p.thumbUrl,filename:p.filename})):
    allPhotos().map(p=>({assetId:p.assetId,thumbUrl:p.urlThumb||"",filename:p.filename||p.assetId}));

  if(!photos.length){grid.innerHTML="<div class='empty' style='grid-column:1/-1'><p>No photos imported yet</p></div>";return;}
  grid.innerHTML=photos.map(p=>`

      ${p.thumbUrl?`<img src="${p.thumbUrl}" loading="lazy" alt="">`:``}
      <div class="pk-cell-lbl">${p.filename||p.assetId}</div></div>`).join("");

function selectInPicker(assetId,el){
  pkActive=assetId;
  document.querySelectorAll(".pk-cell").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");document.getElementById("pkConfirm").disabled=false;
}
function confirmPick(){
  if(!pkActive||!pkSlotId)return;
  if(pkCtx==="home"){STATE.home[pkSlotId]=pkActive;}
  if(pkCtx==="portfolio"){
    var works=getPortfolioWorks();
    var w=works.find(function(w){return w.id===pkSlotId;});
    if(w)w.coverAssetId=pkActive;
  }
  if(pkCtx==="block"){
    var parts=pkSlotId.replace('__block__','').split('__');
    var bIdx=parseInt(parts[0]);var bField=parts[1];
    var blocks=getPageBlocks(activePage);
    if(blocks[bIdx])blocks[bIdx].data[bField]=pkActive;
  }
  if(pkCtx==="blockphotos"){
    var bIdx2=parseInt(pkSlotId.replace('__blockphotos__',''));
    var blocks2=getPageBlocks(activePage);
    if(blocks2[bIdx2]){
      if(!blocks2[bIdx2].data.photos)blocks2[bIdx2].data.photos=[];
      if(!blocks2[bIdx2].data.photos.includes(pkActive))blocks2[bIdx2].data.photos.push(pkActive);
    }
  }
  if(pkCtx==="curated"){
    var cIdx=parseInt(pkSlotId.replace('__curated__',''));
    var cBlocks=getPageBlocks(activePage);
    if(cBlocks[cIdx]){
      if(!cBlocks[cIdx].data.photos)cBlocks[cIdx].data.photos=[];
      var photoObj={assetId:pkActive,caption:''};
      var cWorks=getPortfolioWorks();
      for(var wi=0;wi<cWorks.length;wi++){
        var cw=cWorks[wi];
        if(cw.coverAssetId===pkActive){photoObj.workId=cw.id;break;}
        var gals=cw.galleries||[];
        var found=false;
        for(var gi=0;gi<gals.length;gi++){
          if((gals[gi].photos||[]).indexOf(pkActive)!==-1){
            photoObj.workId=cw.id;photoObj.galleryId=gals[gi].id;found=true;break;
          }
        }
        if(found)break;
      }
      var alreadyIn=cBlocks[cIdx].data.photos.some(function(p){return (typeof p==='string'?p:p.assetId)===pkActive;});
      if(!alreadyIn)cBlocks[cIdx].data.photos.push(photoObj);
    }
  }
  if(pkCtx==="workfeat"){
    var fIdx=parseInt(pkSlotId.replace('__feat__',''));
    var wf=getPortfolioWorks()[fIdx];
    if(wf)wf.featuredImageId=pkActive;
  }
  if(pkCtx==="galcover"){
    var gparts=pkSlotId.replace('__galcover__','').split('__');
    var wIdx=parseInt(gparts[0]);var gIdx=parseInt(gparts[1]);
    var w2=getPortfolioWorks()[wIdx];
    if(w2&&w2.galleries&&w2.galleries[gIdx])w2.galleries[gIdx].coverAssetId=pkActive;
  }
  if(pkCtx==="galassign"){
    var aparts=pkSlotId.replace('__galassign__','').split('__');
    var wIdx2=parseInt(aparts[0]);var gIdx2=parseInt(aparts[1]);
    var w3=getPortfolioWorks()[wIdx2];
    if(w3&&w3.galleries&&w3.galleries[gIdx2]){
      if(!w3.galleries[gIdx2].photos)w3.galleries[gIdx2].photos=[];
      if(!w3.galleries[gIdx2].photos.includes(pkActive))w3.galleries[gIdx2].photos.push(pkActive);
    }
  }
  if(pkCtx==="folder"){
    var fparts=pkSlotId.replace('__folder__','').split('__');
    var fwIdx=parseInt(fparts[0]);var fgIdx=parseInt(fparts[1]);var ffIdx=parseInt(fparts[2]);
    var fw=getPortfolioWorks()[fwIdx];
    if(fw&&fw.galleries&&fw.galleries[fgIdx]&&fw.galleries[fgIdx].folders&&fw.galleries[fgIdx].folders[ffIdx]){
      if(!fw.galleries[fgIdx].folders[ffIdx].photos)fw.galleries[fgIdx].folders[ffIdx].photos=[];
      if(!fw.galleries[fgIdx].folders[ffIdx].photos.includes(pkActive))fw.galleries[fgIdx].folders[ffIdx].photos.push(pkActive);
    }
  }
  if(pkCtx==="ogimage"){
    var ogPage=pkSlotId.replace('__ogimage__','');
    if(!STATE.pages)STATE.pages={};
    if(!STATE.pages[ogPage])STATE.pages[ogPage]={title:'',metaDescription:'',blocks:[]};
    STATE.pages[ogPage].ogImage=pkActive;
  }
  closePicker();
  if(activeTab==="pages") showPagesPanel(true);
  if(activeTab==="portfolio") showPortfolioPanel();
  toast("Photo assigned — saving...");
  saveAll();
}

// IMAGES TAB — Browse all CF images, organize into folders, assign to series/slots
// ═══════════════════════════════════════════════════════════════
let imgAllImages=[];
let imgActiveFolder=null;
let imgSelected=new Set();
let imgLoading=false;

function getImgFolders(){return STATE.imgFolders||{};}
function getImgImageFolder(cfId){
  const folders=getImgFolders();
  for(const[fid,fdata]of Object.entries(folders)){
    if(fdata.images&&fdata.images.includes(cfId))return fid;
  }
  return null;
}
function getImgSeriesForImage(cfId){
  const series=[];
  for(const[sid,ids]of Object.entries(STATE.photos||{})){
    if(ids.includes(cfId)){const s=getSeries().find(x=>x.id===sid);series.push(s?s.num+" "+s.title:sid);}
  }
  return series;
}

async function showImagesPanel(){
  setPanel("Images","All Cloudflare Images","<button class='btn pri' onclick='imgRefresh()' data-testid='btn-refresh-images'>Refresh</button>");
  imgSelected=new Set();
  document.getElementById("panelBody").innerHTML=`<div class="img-layout">
    <div class="img-folders" id="imgFolders"></div>
    <div class="img-main">
      <div class="img-toolbar">
        <div class="img-toolbar-left">
          <span class="img-sel-count" id="imgSelCount">0 selected</span>
          <button class="btn" id="imgAssignBtn" onclick="openAssignModal()" disabled data-testid="btn-assign-selected">Assign to Series</button>
          <button class="btn" id="imgMoveBtn" onclick="openMoveToFolder()" disabled>Move to Folder</button>
          <button class="btn red" id="imgDelBtn" onclick="imgDeleteSelected()" disabled data-testid="btn-delete-selected">Delete</button>
        </div>
      </div>
      <div class="img-content" id="imgContent">
        <div class="img-upload-zone" id="imgUploadZone"
          onclick="document.getElementById('imgUploadInput').click()"
          ondragover="event.preventDefault();this.classList.add('drag')"
          ondragleave="this.classList.remove('drag')"
          ondrop="event.preventDefault();this.classList.remove('drag');imgUploadFiles(event.dataTransfer.files)">
          <div style="font-size:20px;opacity:.12;margin-bottom:4px">&#x2191;</div>
          <div style="font-size:9px;letter-spacing:4px;text-transform:uppercase;opacity:.3">Drop photos here or click to upload</div>
        </div>
        <input type="file" id="imgUploadInput" multiple accept="image/*" style="display:none" onchange="imgUploadFiles(this.files)">
        <div id="imgUploadProgress"></div>
        <div id="imgGrid" class="img-grid"></div>
      </div>
    </div>
  </div>`;
  renderImgFolders();
  if(!imgAllImages.length&&!imgLoading)await imgRefresh();
  else renderImgGrid();
}

function renderImgFolders(){
  const el=document.getElementById("imgFolders");
  if(!el)return;
  const folders=getImgFolders();
  const folderIds=Object.keys(folders).sort((a,b)=>(folders[a].name||a).localeCompare(folders[b].name||b));
  const allCount=imgAllImages.length;
  const unassigned=imgAllImages.filter(img=>!getImgImageFolder(img.id)).length;
  let html=`<button class="img-folder-item ${imgActiveFolder===null?"active":""}" onclick="imgSetFolder(null)">
    <span class="img-folder-ico">&#x1f5bc;</span>
    <span class="img-folder-name">All Images</span>
    <span class="img-folder-cnt">${allCount}</span>
  </button>
  <button class="img-folder-item ${imgActiveFolder==="__unassigned"?"active":""}" onclick="imgSetFolder('__unassigned')">
    <span class="img-folder-ico">&#x2609;</span>
    <span class="img-folder-name">Unsorted</span>
    <span class="img-folder-cnt">${unassigned}</span>
  </button>`;
  folderIds.forEach(fid=>{
    const f=folders[fid];
    const cnt=(f.images||[]).length;
    html+=`<button class="img-folder-item ${imgActiveFolder===fid?"active":""}" onclick="imgSetFolder('${fid}')">
      <span class="img-folder-ico">&#x1f4c1;</span>
      <span class="img-folder-name">${esc(f.name||fid)}</span>
      <span class="img-folder-cnt">${cnt}</span>
      <span class="img-folder-acts"><button class="img-folder-del" onclick="event.stopPropagation();imgDeleteFolder('${fid}')" title="Delete folder">&times;</button></span>
    </button>`;
  });
  html+=`<div class="img-new-folder">
    <input id="imgNewFolderName" placeholder="New folder..." onkeydown="if(event.key==='Enter')imgCreateFolder()">
    <button onclick="imgCreateFolder()">+ Add</button>
  </div>`;
  el.innerHTML=html;
}

function imgSetFolder(fid){
  imgActiveFolder=fid;
  imgSelected=new Set();
  renderImgFolders();
  renderImgGrid();
  imgUpdateToolbar();
}

async function imgRefresh(){
  imgLoading=true;
  const grid=document.getElementById("imgGrid");
  if(grid)grid.innerHTML="<div style='grid-column:1/-1;text-align:center;padding:30px;font-size:9px;letter-spacing:3px;text-transform:uppercase;opacity:.3'>Loading images from Cloudflare...</div>";
  try{
    const res=await fetch("/api/images/list");
    if(!res.ok)throw new Error("Failed to load images");
    const data=await res.json();
    imgAllImages=data.images||[];
    if(data.hash)TIA.CF_HASH=data.hash;
    imgAllImages.forEach(img=>{
      if(!CF_PHOTOS[img.id]){
        CF_PHOTOS[img.id]={id:img.id,filename:img.filename||img.id};
        if(!STATE.cf)STATE.cf={assetMeta:{}};
        if(!STATE.cf.assetMeta)STATE.cf.assetMeta={};
        STATE.cf.assetMeta[img.id]={id:img.id,filename:img.filename||img.id};
      }
    });
    renderImgGrid();
    renderImgFolders();
    toast(imgAllImages.length+" images loaded from Cloudflare");
  }catch(err){
    if(grid)grid.innerHTML=`<div style="grid-column:1/-1;color:var(--red);font-size:11px;padding:20px">${esc(err.message)}</div>`;
    toast(err.message,true);
  }
  imgLoading=false;
}

function imgGetFilteredImages(){
  if(imgActiveFolder===null)return imgAllImages;
  if(imgActiveFolder==="__unassigned")return imgAllImages.filter(img=>!getImgImageFolder(img.id));
  const folder=getImgFolders()[imgActiveFolder];
  if(!folder||!folder.images)return[];
  const ids=new Set(folder.images);
  return imgAllImages.filter(img=>ids.has(img.id));
}

function renderImgGrid(){
  const grid=document.getElementById("imgGrid");
  if(!grid)return;
  const images=imgGetFilteredImages();
  if(!images.length){
    grid.innerHTML="<div style='grid-column:1/-1;text-align:center;padding:30px;font-size:9px;letter-spacing:3px;text-transform:uppercase;opacity:.2'>No images</div>";
    return;
  }
  const hash=TIA.CF_HASH||STATE.cf?.hash||"";
  grid.innerHTML=images.map(img=>{
    const sel=imgSelected.has(img.id);
    const seriesList=getImgSeriesForImage(img.id);
    const folderId=getImgImageFolder(img.id);
    const folderName=folderId?getImgFolders()[folderId]?.name:null;
    const inSeries=seriesList.length>0;
    const thumb=hash?`https://imagedelivery.net/${hash}/${img.id}/thumb`:"";
    let badges="";
    if(inSeries)badges+=seriesList.map(s=>`<span class="img-card-badge">${esc(s)}</span>`).join("");
    if(folderName&&imgActiveFolder===null)badges+=`<span class="img-card-badge folder">${esc(folderName)}</span>`;
    const meta=CF_PHOTOS[img.id]||STATE.cf?.assetMeta?.[img.id];
    const exif=meta?.exif;
    let exifHtml="";
    if(exif){
      let parts=[];
      if(exif.model)parts.push(esc(exif.model));
      if(exif.focalLength)parts.push(Math.round(exif.focalLength)+"mm");
      if(exif.fNumber)parts.push("f/"+exif.fNumber);
      if(exif.exposureTime)parts.push(formatExposure(exif.exposureTime));
      if(exif.iso)parts.push("ISO "+exif.iso);
      if(parts.length)exifHtml=`<div class="img-card-exif">${parts.join(" &middot; ")}</div>`;
    }
    return`<div class="img-card ${sel?"selected":""} ${inSeries?"in-series":""}" onclick="imgToggle('${img.id}')" data-testid="img-card-${img.id}">
      ${thumb?`<img src="${thumb}" loading="lazy" alt="">`:""}
      <div class="img-card-check">&#x2713;</div>
      ${badges?`<div class="img-card-badges">${badges}</div>`:""}
      <div class="img-card-info"><div class="img-card-name">${esc(img.filename||img.id)}</div>${exifHtml}</div>
    </div>`;
  }).join("");
}

function imgToggle(id){
  if(imgSelected.has(id))imgSelected.delete(id);else imgSelected.add(id);
  const card=document.querySelector(`[data-testid="img-card-${id}"]`);
  if(card)card.classList.toggle("selected",imgSelected.has(id));
  imgUpdateToolbar();
}

function imgUpdateToolbar(){
  const cnt=document.getElementById("imgSelCount");
  const assignBtn=document.getElementById("imgAssignBtn");
  const moveBtn=document.getElementById("imgMoveBtn");
  const delBtn=document.getElementById("imgDelBtn");
  const n=imgSelected.size;
  if(cnt)cnt.textContent=n+" selected";
  if(assignBtn)assignBtn.disabled=n===0;
  if(moveBtn)moveBtn.disabled=n===0;
  if(delBtn)delBtn.disabled=n===0;
}

function imgCreateFolder(){
  const input=document.getElementById("imgNewFolderName");
  const name=(input?.value||"").trim();
  if(!name)return toast("Enter a folder name",true);
  if(!STATE.imgFolders)STATE.imgFolders={};
  const fid="f-"+Date.now();
  STATE.imgFolders[fid]={name,images:[]};
  input.value="";
  renderImgFolders();
  toast("Folder '"+name+"' created");
}

function imgDeleteFolder(fid){
  if(!STATE.imgFolders||!STATE.imgFolders[fid])return;
  const name=STATE.imgFolders[fid].name||fid;
  if(!confirm("Delete folder '"+name+"'? Images won't be deleted, just unorganized."))return;
  delete STATE.imgFolders[fid];
  if(imgActiveFolder===fid)imgActiveFolder=null;
  renderImgFolders();
  renderImgGrid();
  toast("Folder deleted");
}

function imgRenameFolder(fid){
  const f=STATE.imgFolders?.[fid];
  if(!f)return;
  const name=prompt("Rename folder:",f.name||"");
  if(name===null)return;
  f.name=name.trim()||f.name;
  renderImgFolders();
  toast("Folder renamed");
}

function openMoveToFolder(){
  if(!imgSelected.size)return;
  const folders=getImgFolders();
  const folderIds=Object.keys(folders).sort((a,b)=>(folders[a].name||a).localeCompare(folders[b].name||b));
  if(!folderIds.length)return toast("Create a folder first",true);
  document.getElementById("amTitle").textContent="Move "+imgSelected.size+" image"+(imgSelected.size>1?"s":"")+" to folder";
  let html=`<div class="am-section">
    <span class="am-section-lbl">Select Folder</span>
    <button class="am-opt" onclick="imgMoveToFolder(null)">
      <span class="img-folder-ico">&#x2609;</span> Unsorted (remove from folder)
    </button>`;
  folderIds.forEach(fid=>{
    html+=`<button class="am-opt" onclick="imgMoveToFolder('${fid}')">
      <span class="img-folder-ico">&#x1f4c1;</span> ${esc(folders[fid].name||fid)}
    </button>`;
  });
  html+="</div>";
  document.getElementById("amBody").innerHTML=html;
  document.getElementById("assignModal").classList.add("open");
}

function imgMoveToFolder(fid){
  if(!STATE.imgFolders)STATE.imgFolders={};
  Object.values(STATE.imgFolders).forEach(f=>{
    if(f.images)f.images=f.images.filter(id=>!imgSelected.has(id));
  });
  if(fid&&STATE.imgFolders[fid]){
    if(!STATE.imgFolders[fid].images)STATE.imgFolders[fid].images=[];
    imgSelected.forEach(id=>{
      if(!STATE.imgFolders[fid].images.includes(id))STATE.imgFolders[fid].images.push(id);
    });
  }
  closeAssignModal();
  imgSelected=new Set();
  renderImgFolders();
  renderImgGrid();
  imgUpdateToolbar();
  toast("Images moved");
}

function openAssignModal(){
  if(!imgSelected.size)return;
  const n=imgSelected.size;
  document.getElementById("amTitle").textContent="Assign "+n+" image"+(n>1?"s":"")+" to...";
  let html='';
  const works=getPortfolioWorks();
  if(works.length){
    html+=`<div class="am-section"><span class="am-section-lbl">Collection (under Collection Set)</span>`;
    works.forEach(function(w,wi){
      var gals=w.galleries||[];
      if(gals.length){
        gals.forEach(function(g,gi){
          html+=`<button class="am-opt" onclick="imgAssignToGallery(${wi},${gi})" data-testid="am-gal-${wi}-${gi}">
            <span style="font-size:9px;color:var(--dim);width:20px">&#x25a3;</span> ${esc(w.title)} &rarr; ${esc(g.title||'Untitled')}
          </button>`;
          var folders=g.folders||[];
          folders.forEach(function(f,fi){
            html+=`<button class="am-opt" onclick="imgAssignToFolder(${wi},${gi},${fi})" data-testid="am-folder-${wi}-${gi}-${fi}" style="padding-left:32px">
              <span style="font-size:9px;color:var(--dim);width:20px">&#x25b9;</span> ${esc(g.title||'Untitled')} &rarr; ${esc(f.title||'Untitled Folder')}
            </button>`;
          });
        });
      } else {
        html+=`<div style="padding:4px 12px;font-size:10px;color:var(--dim)">${esc(w.title)} — no collections yet</div>`;
      }
    });
    html+=`</div>`;
  }
  html+=`<div class="am-section"><span class="am-section-lbl">Portfolio Cover</span>`;
  works.forEach(function(w,wi){
    html+=`<button class="am-opt" onclick="imgSetAsPortfolioCover(${wi})" data-testid="am-cover-${wi}">
      <span style="font-size:9px;color:var(--dim);width:20px">&#x2606;</span> Set as cover for: ${esc(w.title)}
    </button>`;
  });
  html+=`</div>`;
  html+=`<div class="am-section"><span class="am-section-lbl">Print</span>
    <button class="am-opt" onclick="imgMarkAsPrint()" data-testid="am-print">
      <span style="font-size:9px;color:var(--dim);width:20px">&#x1F5BC;</span> Mark as Available Print
    </button>
  </div>`;
  const series=getSeries();
  if(series.length){
    html+=`<div class="am-section"><span class="am-section-lbl">Legacy Gallery Series</span>
      ${series.map(s=>`<button class="am-opt" onclick="imgAssignToSeries('${s.id}')">
        <span style="font-size:9px;color:var(--dim);width:20px">${s.num}</span> ${esc(s.title)}
      </button>`).join("")}
    </div>`;
  }
  document.getElementById("amBody").innerHTML=html;
  document.getElementById("assignModal").classList.add("open");
}

function closeAssignModal(){document.getElementById("assignModal").classList.remove("open");}

function imgAssignToGallery(workIdx,galIdx){
  var works=getPortfolioWorks();
  var w=works[workIdx];
  if(!w||!w.galleries||!w.galleries[galIdx])return;
  var g=w.galleries[galIdx];
  if(!g.photos)g.photos=[];
  var added=0;
  imgSelected.forEach(function(cfId){
    if(!g.photos.includes(cfId)){
      g.photos.push(cfId);
      added++;
    }
    if(!CF_PHOTOS[cfId]){
      var img=imgAllImages.find(function(i){return i.id===cfId;});
      CF_PHOTOS[cfId]={id:cfId,filename:img?.filename||cfId};
      if(!STATE.cf)STATE.cf={assetMeta:{}};
      if(!STATE.cf.assetMeta)STATE.cf.assetMeta={};
      STATE.cf.assetMeta[cfId]=CF_PHOTOS[cfId];
    }
  });
  closeAssignModal();
  imgSelected=new Set();
  renderImgGrid();
  imgUpdateToolbar();
  toast(added+" image"+(added>1?"s":"")+" added to "+esc(g.title||"gallery")+" — saving...");
  saveAll();
}

function imgMarkAsPrint(){
  if(!STATE.prints)STATE.prints=[];
  var added=0;
  imgSelected.forEach(function(cfId){
    if(!STATE.prints.includes(cfId)){
      STATE.prints.push(cfId);
      added++;
    }
  });
  closeAssignModal();
  imgSelected=new Set();
  renderImgGrid();
  imgUpdateToolbar();
  toast(added+" image"+(added>1?"s":"")+" marked as print"+(added>1?"s":"")+" — saving...");

function imgAssignToSeries(sid){
  if(!STATE.photos[sid])STATE.photos[sid]=[];
  let added=0;
  imgSelected.forEach(cfId=>{
    if(!STATE.photos[sid].includes(cfId)){
      STATE.photos[sid].push(cfId);

    }

      const img=imgAllImages.find(i=>i.id===cfId);
      CF_PHOTOS[cfId]={id:cfId,filename:img?.filename||cfId};
      if(!STATE.cf)STATE.cf={assetMeta:{}};
      if(!STATE.cf.assetMeta)STATE.cf.assetMeta={};
      STATE.cf.assetMeta[cfId]=CF_PHOTOS[cfId];
    }
  });
  closeAssignModal();
  imgSelected=new Set();
  renderImgGrid();
  imgUpdateToolbar();
  toast(added+" image"+(added>1?"s":"")+" assigned to series — saving...");

async function imgDeleteSelected(){
  if(!imgSelected.size)return;
  if(!confirm("Delete "+imgSelected.size+" image"+(imgSelected.size>1?"s":"")+" from Cloudflare? This cannot be undone."))return;
  let deleted=0;
  for(const cfId of imgSelected){
    try{
      const res=await fetch("/api/images/"+cfId,{method:"DELETE"});
      if(res.ok){
        deleted++;
        imgAllImages=imgAllImages.filter(i=>i.id!==cfId);
        delete CF_PHOTOS[cfId];
        if(STATE.cf?.assetMeta)delete STATE.cf.assetMeta[cfId];
        Object.values(STATE.photos||{}).forEach(ids=>{
          const idx=ids.indexOf(cfId);
          if(idx>=0)ids.splice(idx,1);
        });
        if(STATE.imgFolders){
          Object.values(STATE.imgFolders).forEach(f=>{
            if(f.images)f.images=f.images.filter(id=>id!==cfId);
          });
        }
      }
    }catch{}
  }
  imgSelected=new Set();
  renderImgFolders();
  renderImgGrid();
  imgUpdateToolbar();
  toast(deleted+" image"+(deleted>1?"s":"")+" deleted");
}

async function imgUploadFiles(files){
  const progress=document.getElementById("imgUploadProgress");
  let uploaded=0;
  const total=Array.from(files).filter(f=>f.type.startsWith("image/")).length;
  if(!total)return toast("No image files selected",true);
  if(progress)progress.innerHTML=`<div class="upload-item"><span class="upload-item-name">Uploading ${total} file${total>1?"s":""}...</span><span class="upload-item-status busy">0 / ${total}</span></div><div class="upload-bar"><div class="upload-bar-fill" id="imgUploadBarFill"></div></div>`;
  for(const file of files){
    if(!file.type.startsWith("image/"))continue;
    try{
      const fd=new FormData();
      fd.append("file",file);
      const res=await fetch("/api/images/upload",{method:"POST",body:fd});
      if(!res.ok){const errData=await res.json().catch(()=>({}));throw new Error(errData.error||"Upload failed");}
      const data=await res.json();
      const cfId=data.id;
      const meta={id:cfId,filename:data.filename||file.name};
      if(data.exif&&Object.keys(data.exif).length>0)meta.exif=data.exif;
      if(!STATE.cf)STATE.cf={assetMeta:{}};
      if(!STATE.cf.assetMeta)STATE.cf.assetMeta={};
      STATE.cf.assetMeta[cfId]=meta;
      CF_PHOTOS[cfId]=meta;
      imgAllImages.push({id:cfId,filename:data.filename||file.name,uploaded:new Date().toISOString(),variants:data.variants||[]});
      if(imgActiveFolder&&imgActiveFolder!=="__unassigned"&&STATE.imgFolders?.[imgActiveFolder]){
        if(!STATE.imgFolders[imgActiveFolder].images)STATE.imgFolders[imgActiveFolder].images=[];
        STATE.imgFolders[imgActiveFolder].images.push(cfId);
      }
      uploaded++;
      const bar=document.getElementById("imgUploadBarFill");
      if(bar)bar.style.width=Math.round((uploaded/total)*100)+"%";
      const statusEl=progress?.querySelector(".upload-item-status");
      if(statusEl){statusEl.textContent=uploaded+" / "+total;if(uploaded===total)statusEl.className="upload-item-status ok";}
    }catch(err){
      if(progress)progress.innerHTML+=`<div class="upload-item"><span class="upload-item-name">${esc(file.name)}</span><span class="upload-item-status err">${esc(err.message)}</span></div>`;
    }
  }
  if(uploaded>0){
    renderImgFolders();
    renderImgGrid();
    toast(uploaded+" image"+(uploaded>1?"s":"")+" uploaded");
  }
}

// HELPERS
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function toast(msg,isErr=false){
  const t=document.getElementById("toast");t.textContent=msg;
  t.className="toast show"+(isErr?" err":"");clearTimeout(t._t);
  t._t=setTimeout(()=>t.classList.remove("show"),3500);
}
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closePicker();closeBlockPicker();closeGalPicker();}});
if(authed)init();
