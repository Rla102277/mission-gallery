# Netlify configuration for The Infinite Arch
# theinfinitearch.com

[build]
  publish = "."

# Clean URLs — /about instead of /pages/about.html
[[redirects]]
  from = "/about"
  to = "/pages/about.html"
  status = 200

[[redirects]]
  from = "/portfolio"
  to = "/pages/portfolio.html"
  status = 200

[[redirects]]
  from = "/prints"
  to = "/pages/prints.html"
  status = 200

[[redirects]]
  from = "/hope-hike"
  to = "/pages/hope-hike.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/pages/contact.html"
  status = 200

# Gallery routes
[[redirects]]
  from = "/gallery/iceland"
  to = "/gallery/iceland.html"
  status = 200

[[redirects]]
  from = "/gallery/*"
  to = "/gallery/:splat.html"
  status = 200

# Admin — requires Netlify Identity login
# Protect the whole /admin path
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

# Gallery clean URL
[[redirects]]
  from = "/gallery"
  to = "/pages/gallery.html"
  status = 200

# 404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404

# Security + performance headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Protect /admin/* — requires Netlify Identity login
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200
  conditions = {Role = ["admin"]}

[[redirects]]
  from = "/admin/*"
  to = "/"
  status = 302
  force = true
