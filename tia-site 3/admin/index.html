<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TIA Admin</title>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg:#111310; --surface:#191c17; --surface2:#1f2219;
      --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.12);
      --cream:#ede9e2; --muted:rgba(237,233,226,0.4); --dim:rgba(237,233,226,0.18);
      --gold:#c9a227; --green:#5a9e6f; --red:#a05050; --blue:#4a7ea0;
      --sage:#3d4039; --font:'Helvetica Neue',Arial,sans-serif;
    }
    html,body { height:100%; overflow:hidden; background:var(--bg); color:var(--cream); font-family:var(--font); font-size:13px; }
    a { color:inherit; text-decoration:none; }
    button { font-family:var(--font); cursor:pointer; }
    input,textarea { font-family:var(--font); }

    /* ─── AUTH SCREEN ─────────────────────────── */
    #authScreen {
      position:fixed; inset:0; z-index:999; background:var(--bg);
      display:flex; align-items:center; justify-content:center;
    }
    .auth-box { width:340px; }
    .auth-logo { font-size:9px; letter-spacing:6px; text-transform:uppercase; color:var(--dim); margin-bottom:32px; display:block; }
    .auth-title { font-size:26px; font-weight:300; margin-bottom:28px; opacity:0.8; }
    .auth-field { margin-bottom:14px; }
    .auth-field label { font-size:9px; letter-spacing:4px; text-transform:uppercase; color:var(--dim); display:block; margin-bottom:6px; }
    .auth-field input {
      width:100%; padding:10px 14px; background:var(--surface);
      border:1px solid var(--border2); color:var(--cream); font-size:13px;
      outline:none; transition:border-color 0.2s;
    }
    .auth-field input:focus { border-color:rgba(255,255,255,0.3); }
    .auth-submit {
      width:100%; margin-top:20px; padding:12px;
      background:var(--sage); border:none; color:var(--cream);
      font-size:9px; letter-spacing:5px; text-transform:uppercase;
      transition:background 0.2s;
    }
    .auth-submit:hover { background:#4a4e44; }
    .auth-error { color:var(--red); font-size:10px; letter-spacing:3px; text-transform:uppercase; margin-top:12px; display:none; }
    .auth-error.show { display:block; }

    /* ─── APP SHELL ───────────────────────────── */
    #app { display:none; grid-template-rows:52px 1fr; height:100vh; }
    #app.show { display:grid; }

    /* TOPBAR */
    .topbar {
      display:flex; align-items:center; justify-content:space-between;
      padding:0 24px; border-bottom:1px solid var(--border);
      background:var(--surface); flex-shrink:0;
    }
    .tb-brand { font-size:9px; letter-spacing:5px; text-transform:uppercase; color:var(--dim); }
    .tb-brand strong { color:var(--cream); opacity:0.8; }
    .tb-nav { display:flex; gap:2px; }
    .tb-tab {
      padding:8px 18px; font-size:8px; letter-spacing:4px; text-transform:uppercase;
      border:none; background:transparent; color:var(--muted); cursor:pointer; transition:all 0.2s;
      border-bottom:2px solid transparent; margin-bottom:-1px;
    }
    .tb-tab:hover { color:var(--cream); }
    .tb-tab.active { color:var(--cream); border-bottom-color:var(--gold); }
    .tb-right { display:flex; gap:12px; align-items:center; }
    .tb-signout { font-size:8px; letter-spacing:4px; text-transform:uppercase; border:1px solid var(--border); background:transparent; color:var(--muted); padding:5px 14px; transition:all 0.2s; }
    .tb-signout:hover { color:var(--cream); border-color:var(--border2); }
    .tb-save-all { font-size:8px; letter-spacing:4px; text-transform:uppercase; border:none; background:var(--gold); color:#000; padding:6px 18px; font-weight:600; transition:opacity 0.2s; }
    .tb-save-all:hover { opacity:0.85; }

    /* BODY */
    .body { display:grid; grid-template-columns:220px 1fr; overflow:hidden; }

    /* ─── SIDEBAR ─────────────────────────────── */
    .sidebar { border-right:1px solid var(--border); overflow-y:auto; background:var(--surface); }
    .sb-group { padding:18px 0 6px; }
    .sb-group-label { font-size:8px; letter-spacing:5px; text-transform:uppercase; color:var(--dim); padding:0 16px 8px; display:block; }
    .sb-item {
      display:flex; align-items:center; gap:10px; padding:9px 16px;
      border:none; background:transparent; color:var(--muted); cursor:pointer;
      width:100%; text-align:left; font-size:12px; font-family:var(--font);
      transition:all 0.15s; border-left:2px solid transparent;
    }
    .sb-item:hover { color:var(--cream); background:rgba(255,255,255,0.03); }
    .sb-item.active { color:var(--cream); background:rgba(255,255,255,0.05); border-left-color:var(--gold); }
    .sb-item-num { font-size:8px; letter-spacing:2px; color:var(--dim); width:18px; flex-shrink:0; }
    .sb-item-name { flex:1; line-height:1.3; }
    .sb-item-count { font-size:9px; color:var(--dim); }
    .sb-item-count.has { color:var(--green); }
    .sb-divider { height:1px; background:var(--border); margin:6px 16px; }

    /* ─── MAIN PANEL ──────────────────────────── */
    .main { display:flex; flex-direction:column; overflow:hidden; }
    .panel-head {
      padding:18px 28px 14px; border-bottom:1px solid var(--border);
      display:flex; align-items:center; justify-content:space-between; flex-shrink:0;
      background:var(--surface2);
    }
    .ph-eyebrow { font-size:8px; letter-spacing:5px; text-transform:uppercase; color:var(--dim); margin-bottom:4px; }
    .ph-title { font-size:20px; font-weight:300; }
    .ph-actions { display:flex; gap:8px; }

    .btn {
      padding:6px 16px; font-size:8px; letter-spacing:4px; text-transform:uppercase;
      border:1px solid var(--border2); background:transparent; color:var(--muted);
      cursor:pointer; transition:all 0.2s; font-family:var(--font);
    }
    .btn:hover { color:var(--cream); border-color:rgba(255,255,255,0.3); }
    .btn.primary { background:var(--sage); border-color:var(--sage); color:var(--cream); }
    .btn.primary:hover { background:#4a4e44; }
    .btn.success { background:var(--green); border-color:var(--green); color:#fff; }
    .btn:disabled { opacity:0.3; cursor:not-allowed; }

    /* panel body scrolls */
    .panel-body { flex:1; overflow-y:auto; padding:24px 28px; }

    /* ─── UPLOAD / DROP ZONE ──────────────────── */
    .drop-zone {
      border:1px dashed rgba(255,255,255,0.1); border-radius:2px; padding:32px 20px;
      text-align:center; cursor:pointer; transition:all 0.25s; position:relative; margin-bottom:22px;
    }
    .drop-zone:hover,.drop-zone.over { border-color:rgba(201,162,39,0.5); background:rgba(201,162,39,0.03); }
    .drop-zone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
    .dz-icon { font-size:26px; opacity:0.2; margin-bottom:6px; }
    .dz-text { font-size:12px; opacity:0.35; margin-bottom:3px; }
    .dz-hint { font-size:9px; letter-spacing:3px; text-transform:uppercase; opacity:0.2; }

    /* ─── QUEUE ───────────────────────────────── */
    .sec-label {
      font-size:8px; letter-spacing:5px; text-transform:uppercase; color:var(--dim);
      margin-bottom:10px; display:flex; align-items:center; justify-content:space-between;
    }
    .sec-label button { font-size:8px; letter-spacing:3px; text-transform:uppercase; border:none; background:none; color:var(--dim); cursor:pointer; padding:2px; }
    .sec-label button:hover { color:var(--muted); }
    .progress-wrap { height:2px; background:var(--border); border-radius:1px; overflow:hidden; margin-bottom:16px; }
    .progress-bar { height:100%; background:var(--gold); width:0%; transition:width 0.3s; }
    .queue-list { display:flex; flex-direction:column; gap:5px; margin-bottom:20px; }
    .q-item {
      display:grid; grid-template-columns:44px 1fr 80px; gap:12px; align-items:center;
      padding:8px 12px; background:var(--surface2); border:1px solid var(--border);
    }
    .q-thumb { width:44px; height:32px; object-fit:cover; background:#2a2e28; display:block; }
    .q-name { font-size:11px; opacity:0.6; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .q-size { font-size:9px; letter-spacing:2px; opacity:0.25; margin-top:1px; }
    .q-status { font-size:8px; letter-spacing:3px; text-transform:uppercase; text-align:right; }
    .q-status.pending { color:var(--dim); }
    .q-status.uploading { color:var(--gold); }
    .q-status.done { color:var(--green); }
    .q-status.error { color:var(--red); }

    /* ─── PHOTO GRID ──────────────────────────── */
    .photo-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:5px; }
    .pg-cell {
      position:relative; aspect-ratio:3/2; background:var(--surface2);
      border:2px solid transparent; overflow:hidden; cursor:pointer; border-radius:1px;
      transition:border-color 0.2s;
    }
    .pg-cell:hover { border-color:rgba(255,255,255,0.2); }
    .pg-cell.selected { border-color:var(--gold) !important; }
    .pg-cell.cover-star { border-color:var(--green) !important; }
    .pg-cell img { width:100%; height:100%; object-fit:cover; display:block; transition:opacity 0.2s; }
    .pg-cell:hover img { opacity:0.7; }
    .pg-badge {
      position:absolute; top:5px; left:5px; font-size:8px; letter-spacing:2px;
      text-transform:uppercase; padding:2px 6px; border-radius:1px;
    }
    .pg-badge.cover { background:var(--green); color:#fff; }
    .pg-badge.selected { background:var(--gold); color:#000; }
    .pg-overlay {
      position:absolute; inset:0; background:rgba(0,0,0,0.0);
      display:flex; align-items:center; justify-content:center; gap:5px;
      opacity:0; transition:all 0.2s;
    }
    .pg-cell:hover .pg-overlay { opacity:1; background:rgba(0,0,0,0.45); }
    .pg-btn {
      padding:3px 9px; font-size:8px; letter-spacing:2px; text-transform:uppercase;
      border:1px solid rgba(255,255,255,0.4); background:rgba(0,0,0,0.7); color:#fff;
      cursor:pointer; transition:background 0.15s;
    }
    .pg-btn:hover { background:rgba(0,0,0,0.9); }
    .pg-label { position:absolute; bottom:0; left:0; right:0; padding:3px 5px; background:linear-gradient(to top,rgba(0,0,0,0.8),transparent); font-size:8px; opacity:0.5; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    /* empty */
    .empty { padding:40px 0; text-align:center; opacity:0.2; }
    .empty p { font-size:9px; letter-spacing:4px; text-transform:uppercase; }

    /* shimmer */
    .shimmer { background:linear-gradient(90deg,var(--surface) 25%,rgba(255,255,255,0.03) 50%,var(--surface) 75%); background-size:200% 100%; animation:sh 1.4s infinite; }
    @keyframes sh { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    /* ─── SETTINGS PANEL ──────────────────────── */
    .settings-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
    .setting-card { background:var(--surface2); border:1px solid var(--border); padding:18px; }
    .sc-label { font-size:8px; letter-spacing:5px; text-transform:uppercase; color:var(--dim); margin-bottom:10px; display:block; }
    .sc-name-input {
      width:100%; padding:8px 12px; background:var(--bg); border:1px solid var(--border2);
      color:var(--cream); font-size:14px; outline:none; margin-bottom:10px;
      transition:border-color 0.2s;
    }
    .sc-name-input:focus { border-color:rgba(255,255,255,0.3); }
    .sc-desc-input {
      width:100%; padding:8px 12px; background:var(--bg); border:1px solid var(--border2);
      color:var(--cream); font-size:12px; outline:none; resize:vertical; min-height:64px;
      font-family:var(--font); line-height:1.6; transition:border-color 0.2s;
    }
    .sc-desc-input:focus { border-color:rgba(255,255,255,0.3); }
    .sc-thumb { width:100%; aspect-ratio:16/7; object-fit:cover; display:block; margin-bottom:10px; background:var(--bg); }
    .sc-no-cover { width:100%; aspect-ratio:16/7; background:var(--bg); display:flex; align-items:center; justify-content:center; margin-bottom:10px; font-size:9px; letter-spacing:3px; text-transform:uppercase; opacity:0.2; }

    /* ─── PAGE SLOTS PANEL ────────────────────── */
    .slots-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .slot-card { background:var(--surface2); border:1px solid var(--border); overflow:hidden; cursor:pointer; transition:border-color 0.2s; }
    .slot-card:hover { border-color:var(--border2); }
    .slot-card.filled { border-color:rgba(90,158,111,0.3); }
    .slot-card.picking { border-color:var(--gold); }
    .slot-img { width:100%; aspect-ratio:16/7; object-fit:cover; display:block; background:var(--bg); }
    .slot-empty { width:100%; aspect-ratio:16/7; background:var(--bg); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:6px; }
    .slot-empty-icon { font-size:20px; opacity:0.15; }
    .slot-empty-label { font-size:9px; letter-spacing:3px; text-transform:uppercase; opacity:0.2; }
    .slot-info { padding:10px 14px 12px; display:flex; align-items:center; justify-content:space-between; }
    .slot-name { font-size:10px; letter-spacing:3px; text-transform:uppercase; color:var(--muted); }
    .slot-action { font-size:8px; letter-spacing:3px; text-transform:uppercase; color:var(--dim); }
    .slot-card.filled .slot-action { color:var(--green); }
    .slot-card.picking .slot-action { color:var(--gold); }

    /* ─── IMAGE PICKER MODAL ─────────────────── */
    #pickerModal {
      position:fixed; inset:0; z-index:800; background:rgba(0,0,0,0.88);
      display:none; align-items:center; justify-content:center;
    }
    #pickerModal.open { display:flex; }
    .picker-box {
      background:var(--surface); border:1px solid var(--border2);
      width:min(900px,95vw); max-height:85vh; display:flex; flex-direction:column; border-radius:2px;
    }
    .picker-head {
      padding:16px 20px; border-bottom:1px solid var(--border);
      display:flex; align-items:center; justify-content:space-between; flex-shrink:0;
    }
    .picker-title { font-size:12px; letter-spacing:3px; text-transform:uppercase; color:var(--muted); }
    .picker-slot-name { font-size:16px; font-weight:300; }
    .picker-close { font-size:20px; color:var(--dim); cursor:pointer; transition:color 0.2s; border:none; background:none; }
    .picker-close:hover { color:var(--cream); }
    .picker-filter {
      padding:12px 20px; border-bottom:1px solid var(--border);
      display:flex; gap:8px; flex-wrap:wrap; flex-shrink:0;
    }
    .pf-btn {
      padding:4px 12px; font-size:8px; letter-spacing:3px; text-transform:uppercase;
      border:1px solid var(--border); background:transparent; color:var(--muted); cursor:pointer; transition:all 0.15s;
    }
    .pf-btn:hover,.pf-btn.active { background:rgba(255,255,255,0.07); color:var(--cream); border-color:var(--border2); }
    .picker-grid-wrap { overflow-y:auto; padding:16px 20px; flex:1; }
    .picker-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:6px; }
    .pick-cell {
      position:relative; aspect-ratio:3/2; background:var(--surface2);
      overflow:hidden; cursor:pointer; border:2px solid transparent;
      transition:border-color 0.2s; border-radius:1px;
    }
    .pick-cell:hover { border-color:rgba(255,255,255,0.3); }
    .pick-cell.active { border-color:var(--gold); }
    .pick-cell img { width:100%; height:100%; object-fit:cover; display:block; }
    .pick-label { position:absolute; bottom:0; left:0; right:0; padding:3px 5px; background:linear-gradient(to top,rgba(0,0,0,0.85),transparent); font-size:8px; opacity:0.5; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .picker-foot { padding:14px 20px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:10px; flex-shrink:0; }

    /* ─── TOAST ───────────────────────────────── */
    .toast {
      position:fixed; bottom:20px; right:20px; z-index:9999;
      padding:9px 20px; background:var(--sage); border:1px solid rgba(255,255,255,0.07);
      font-size:8px; letter-spacing:4px; text-transform:uppercase; color:var(--cream);
      opacity:0; transform:translateY(5px); transition:all 0.25s; pointer-events:none; border-radius:1px;
    }
    .toast.show { opacity:1; transform:translateY(0); }
    .toast.err { background:var(--red); }

    /* scrollbar */
    ::-webkit-scrollbar { width:5px; height:5px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.1); border-radius:3px; }
  </style>
</head>
<body>

<!-- ─── AUTH ─────────────────────────────────────── -->
<div id="authScreen">
  <div class="auth-box">
    <span class="auth-logo">The Infinite Arch · Admin</span>
    <h1 class="auth-title">Photo Manager</h1>
    <div class="auth-field">
      <label>Username</label>
      <input type="text" id="authUser" placeholder="username" autocomplete="username">
    </div>
    <div class="auth-field">
      <label>Password</label>
      <input type="password" id="authPass" placeholder="password" autocomplete="current-password"
             onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="auth-submit" onclick="doLogin()">Sign In</button>
    <div class="auth-error" id="authError">Incorrect credentials</div>
  </div>
</div>

<!-- ─── APP ──────────────────────────────────────── -->
<div id="app">
  <div class="topbar">
    <span class="tb-brand">TIA · <strong>Admin</strong></span>
    <div class="tb-nav">
      <button class="tb-tab active" data-tab="galleries" onclick="switchTab('galleries')">Galleries</button>
      <button class="tb-tab" data-tab="upload" onclick="switchTab('upload')">Upload</button>
      <button class="tb-tab" data-tab="homepage" onclick="switchTab('homepage')">Homepage</button>
      <button class="tb-tab" data-tab="portfolio" onclick="switchTab('portfolio')">Portfolio</button>
      <button class="tb-tab" data-tab="settings" onclick="switchTab('settings')">Settings</button>
    </div>
    <div class="tb-right">
      <button class="tb-save-all" onclick="saveAll()">Save All</button>
      <button class="tb-signout" onclick="doLogout()">Sign Out</button>
    </div>
  </div>

  <div class="body">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sb-group">
        <span class="sb-group-label">Iceland 2026</span>
        <div id="seriesList"></div>
      </div>
      <div class="sb-divider"></div>
      <div class="sb-group">
        <button class="sb-item" data-view="home-slots" onclick="setView('home-slots')">
          <span class="sb-item-num">⌂</span>
          <span class="sb-item-name">Homepage Slots</span>
        </button>
        <button class="sb-item" data-view="portfolio-slots" onclick="setView('portfolio-slots')">
          <span class="sb-item-num">◻</span>
          <span class="sb-item-name">Portfolio Covers</span>
        </button>
      </div>
    </aside>

    <!-- MAIN -->
    <div class="main">
      <div class="panel-head">
        <div>
          <div class="ph-eyebrow" id="panelEye">Select a gallery</div>
          <div class="ph-title" id="panelTitle">Photo Manager</div>
        </div>
        <div class="ph-actions" id="panelActions"></div>
      </div>
      <div class="panel-body" id="panelBody">
        <div class="empty"><p>Choose a collection or tab above</p></div>
      </div>
    </div>
  </div>
</div>

<!-- ─── IMAGE PICKER MODAL ────────────────────────── -->
<div id="pickerModal">
  <div class="picker-box">
    <div class="picker-head">
      <div>
        <div class="picker-title">Choose Photo For</div>
        <div class="picker-slot-name" id="pickerSlotName">—</div>
      </div>
      <button class="picker-close" onclick="closePicker()">✕</button>
    </div>
    <div class="picker-filter" id="pickerFilter"></div>
    <div class="picker-grid-wrap">
      <div class="picker-grid" id="pickerGrid"></div>
    </div>
    <div class="picker-foot">
      <button class="btn" onclick="closePicker()">Cancel</button>
      <button class="btn primary" id="pickerConfirmBtn" onclick="confirmPick()" disabled>Use This Photo</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ════════════════════════════════════════════════════════════
// AUTH — hardcoded credentials
// ════════════════════════════════════════════════════════════
const CREDS = { user:'rla1022', pass:'!1!680300Ra!1!' };

function doLogin() {
  const u = document.getElementById('authUser').value;
  const p = document.getElementById('authPass').value;
  if (u === CREDS.user && p === CREDS.pass) {
    sessionStorage.setItem('tia_auth','1');
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('app').classList.add('show');
    init();
  } else {
    document.getElementById('authError').classList.add('show');
    document.getElementById('authPass').value = '';
  }
}

function doLogout() {
  sessionStorage.removeItem('tia_auth');
  location.reload();
}

// Auto-login if session active
if (sessionStorage.getItem('tia_auth') === '1') {
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('app').classList.add('show');
}

// ════════════════════════════════════════════════════════════
// CONFIG
// ════════════════════════════════════════════════════════════
const CLOUD  = 'duxiir9lv';
const PRESET = 'tia_unsigned';
const FOLDER = 'tia';

// Series definitions — titles/descriptions can be overridden by settings
const DEFAULT_SERIES = [
  { id:'s1', num:'01', folder:'s1-solitude-scale',      title:'Solitude & Scale',        subtitle:'The Secret Lagoon',                type:'Triptych' },

// ════════════════════════════════════════════════════════════
// CLOUDINARY FETCH
// ════════════════════════════════════════════════════════════
async function fetchFolder(folder) {
  try {
    const url = `https://res.cloudinary.com/${CLOUD}/image/list/${FOLDER}/${folder}.json`;
    const res = await fetch(url + '?t=' + Date.now());
    if (!res.ok) return [];
    const data = await res.json();
    return (data.resources || []).map(r => ({
      publicId: r.public_id,
      url:   `https://res.cloudinary.com/${CLOUD}/image/upload/q_auto,f_auto/${r.public_id}`,
      thumb: `https://res.cloudinary.com/${CLOUD}/image/upload/w_280,q_auto,f_auto/${r.public_id}`,
      large: `https://res.cloudinary.com/${CLOUD}/image/upload/w_1600,q_auto,f_auto/${r.public_id}`,
      filename: r.public_id.split('/').pop(),
    }));
  } catch { return []; }
}

async function ensurePhotos(folderId, folderPath) {
  if (!PHOTOS[folderId]) {
    PHOTOS[folderId] = null; // loading
    PHOTOS[folderId] = await fetchFolder(folderPath);
  }
  return PHOTOS[folderId] || [];
}

function allPhotos() {
  const all = [];
  Object.values(PHOTOS).forEach(arr => { if (Array.isArray(arr)) all.push(...arr); });
  return all;
}

  const sidebar = document.getElementById('sidebar');

  else if (tab === 'upload') showUploadPanel();
  else { setPanel('','Photo Manager'); document.getElementById('panelBody').innerHTML = '<div class="empty"><p>Choose a collection from the left</p></div>'; }
}

async function showSeriesView(sid) {
  const s = getSeries().find(x => x.id === sid);
  if (!s) return;

  setPanel(`Series ${s.num}`, s.title,
    `<button class="btn" onclick="showRenamePanel('${sid}')">✎ Rename</button>
     <button class="btn primary" onclick="startUploadFor('${sid}')">+ Upload Photos</button>`
  );

  const body = document.getElementById('panelBody');
  body.innerHTML = `<div class="shimmer" style="height:120px;margin-bottom:16px;border-radius:1px"></div><div class="empty"><p>Loading photos…</p></div>`;

  const photos = await ensurePhotos(sid, s.folder);
  renderSidebar();

  const cover = STATE.series[sid]?.coverPublicId || photos[0]?.publicId;

  let html = '';

  // rename inline strip
  html += `
    <div style="background:var(--surface2);border:1px solid var(--border);padding:16px 18px;margin-bottom:18px;display:grid;grid-template-columns:1fr 1fr;gap:16px;">
      <div>
        <div class="sc-label">Gallery Title</div>

        <input class="sc-name-input" id="inlineSub" value="${escHtml(s.subtitle)}" placeholder="Subtitle" oninput="updateSeriesField('${sid}','subtitle',this.value)">
      </div>
      <div style="grid-column:span 2">
        <div class="sc-label">Description</div>
        <textarea class="sc-desc-input" id="inlineDesc" placeholder="Describe this series…" oninput="updateSeriesField('${sid}','description',this.value)">${escHtml(s.description||'')}</textarea>
      </div>
    </div>`;

  if (photos.length === 0) {
    html += `<div class="empty"><p>No photos uploaded yet — click "+ Upload Photos"</p></div>`;
  } else {
    html += `<div class="sec-label"><span>${photos.length} photos in Cloudinary — click ★ to set cover</span></div>`;
    html += `<div class="photo-grid">`;
    photos.forEach(p => {
      const isCover = p.publicId === cover;
      html += `
        <div class="pg-cell ${isCover ? 'cover-star' : ''}" id="pgc-${safeId(p.publicId)}">
          <img src="${p.thumb}" loading="lazy" alt="${p.filename}">

function startUploadFor(sid) {
  uploadTarget = sid;
  switchTab('upload');
}

function setupDz() {
  const dz = document.getElementById('dz');
  if (!dz) return;
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('over'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('over'));
  dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('over'); handleFiles(e.dataTransfer.files); });
}

function handleFiles(files) {
  if (!uploadTarget) { toast('Select a series first', true); return; }
  Array.from(files).forEach(f => queue.push({ file:f, status:'pending', preview: URL.createObjectURL(f) }));
  renderQueueUI();
}

function renderQueueUI() {
  const wrap = document.getElementById('queueWrap');
  const list = document.getElementById('qList');
  const cnt  = document.getElementById('qCount');
  if (!wrap || !list) return;
  if (queue.length === 0) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'block';
  if (cnt) cnt.textContent = queue.filter(i => i.status==='pending').length;
  list.innerHTML = queue.map((item, i) => {
    const kb = item.file.size > 1024*1024
      ? (item.file.size/1024/1024).toFixed(1)+'MB'
      : Math.round(item.file.size/1024)+'KB';
    return `
      <div class="q-item">
        <img class="q-thumb" src="${item.preview}">
        <div>
          <div class="q-name">${item.file.name}</div>
          <div class="q-size">${kb}</div>
        </div>
        <span class="q-status ${item.status}" id="qs${i}">${item.status}</span>
      </div>`;
  }).join('');
}

function clearPending() {
  queue = queue.filter(i => i.status !== 'pending');
  renderQueueUI();
}

async function uploadAll() {
  if (!uploadTarget) { toast('Select a series first', true); return; }
  const pending = queue.filter(i => i.status === 'pending');
  if (!pending.length) { toast('Nothing to upload'); return; }

  const s = getSeries().find(x => x.id === uploadTarget);
  const folder = `${FOLDER}/${s.folder}`;
  const btn = document.getElementById('uploadAllBtn');
  if (btn) btn.disabled = true;

  for (let i = 0; i < queue.length; i++) {
    const item = queue[i];
    if (item.status !== 'pending') continue;
    item.status = 'uploading';
    const el = document.getElementById(`qs${i}`);
    if (el) { el.className='q-status uploading'; el.textContent='uploading'; }

    try {
      const fd = new FormData();
      fd.append('file', item.file);
      fd.append('upload_preset', PRESET);
      fd.append('folder', folder);
      const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD}/image/upload`, { method:'POST', body:fd });
      if (!res.ok) throw new Error(await res.text());
      item.status = 'done';
      if (el) { el.className='q-status done'; el.textContent='done'; }
    } catch(err) {
      item.status = 'error';
      if (el) { el.className='q-status error'; el.textContent='error'; }
      console.error(err);
    }

    const done = queue.filter(x => x.status!=='pending').length;
    const pbar = document.getElementById('pbar');
    if (pbar) pbar.style.width = (done/queue.length*100)+'%';
    const cnt = document.getElementById('qCount');
    if (cnt) cnt.textContent = queue.filter(i => i.status==='pending').length;
  }

  // Invalidate cache and refresh
  delete PHOTOS[uploadTarget];
  await ensurePhotos(uploadTarget, s.folder);
  renderSidebar();
  if (btn) btn.disabled = false;
  toast('Upload complete ✓');
}

function openPicker(slotId, ctx, label) {

function closePicker() {
  document.getElementById('pickerModal').classList.remove('open');

function renderPickerFilter() {
  const el = document.getElementById('pickerFilter');
  const series = getSeries();
  el.innerHTML = `<button class="pf-btn active" onclick="renderPickerGrid(null);setActiveFilter(this)">All</button>` +
    series.map(s => `<button class="pf-btn" onclick="renderPickerGrid('${s.id}');setActiveFilter(this)">${s.num} — ${escHtml(s.title)}</button>`).join('');

function setActiveFilter(btn) {
  document.querySelectorAll('.pf-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function renderPickerGrid(filterSid) {
  const grid = document.getElementById('pickerGrid');
  let photos = filterSid ? (PHOTOS[filterSid] || []) : allPhotos();
  if (photos.length === 0) {
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><p>${filterSid ? 'No photos in this series yet' : 'No photos uploaded yet'}</p></div>`;
    return;

  grid.innerHTML = photos.map(p => `

      <img src="${p.thumb}" loading="lazy" alt="${p.filename}">
      <div class="pick-label">${p.filename}</div>

function selectInPicker(publicId, el) {
  pickerActive = publicId;
  document.querySelectorAll('.pick-cell').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('pickerConfirmBtn').disabled = false;
}

function confirmPick() {
  if (!pickerActive || !pickerSlotId) return;
  if (pickerSlotCtx === 'home')      STATE.home[pickerSlotId]      = pickerActive;
  if (pickerSlotCtx === 'portfolio') STATE.portfolio[pickerSlotId] = pickerActive;
  if (pickerSlotCtx === 'cover') {
    if (!STATE.series[pickerSlotId]) STATE.series[pickerSlotId] = {};
    STATE.series[pickerSlotId].coverPublicId = pickerActive;
  }
  saveAll();
  closePicker();

  // Refresh current view
  if (activeTab === 'homepage')  showHomeSlots();
  if (activeTab === 'portfolio') showPortfolioSlots();
  toast('Photo assigned ✓');
}

// ════════════════════════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════════════════════════
function findPhoto(publicId) {
  if (!publicId) return null;
  for (const arr of Object.values(PHOTOS)) {
    if (!Array.isArray(arr)) continue;
    const found = arr.find(p => p.publicId === publicId);
    if (found) return found;
  }
  return null;
}

function copyUrl(url) {
  navigator.clipboard.writeText(url)
    .then(() => toast('URL copied'))
    .catch(() => { prompt('Copy this URL:', url); });
}

function safeId(str) { return str.replace(/[^a-z0-9]/gi, '_'); }
function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function toast(msg, isErr=false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.classList.remove('show'), 3000);
}

// ════════════════════════════════════════════════════════════
// KEYBOARD
// ════════════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closePicker();
  if (e.key === 'Enter' && document.getElementById('authScreen').style.display !== 'none') doLogin();
});

// ════════════════════════════════════════════════════════════
// BOOT
// ════════════════════════════════════════════════════════════
if (sessionStorage.getItem('tia_auth') === '1') init();
</script>
