<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="The Infinite Arch — Fine Art Landscape Photography. Beyond the Daydream.">
  <title>The Infinite Arch — Beyond the Daydream</title>
  <link rel="stylesheet" href="/assets/css/tia.css">
  <link rel="stylesheet" href="/assets/css/blocks.css">
  <style>.page-content { padding-top: 0; }</style>
</head>
<body>
<div class="page-content" id="pageBlocks" data-testid="page-content-home"></div>
<script src="/assets/js/tia-data.js"></script>
<script src="/assets/js/block-renderer.js"></script>
<script>
(async function() {
  try {
    var cfRes = await fetch('/api/images/config');
    if (cfRes.ok) { var cfg = await cfRes.json(); if (cfg.hash) TIA.CF_HASH = cfg.hash; }
  } catch(e) {}
  await TIA.load();
  var state = TIA.getState();
  var pageData = state.pages && state.pages['home'];
  var blocks = pageData ? pageData.blocks : BlockRenderer.defaultBlocks('home');
  document.getElementById('pageBlocks').innerHTML = BlockRenderer.render(blocks, state);
  if (pageData && pageData.title) document.title = pageData.title;
  if (pageData && pageData.metaDescription) {
    var md = document.querySelector('meta[name="description"]');
    if (md) md.content = pageData.metaDescription;
  }
  var heroId = state.home && state.home.hero_bg;
  if (heroId) {
    var heroUrl = TIA.photoUrl(heroId, 'hero');
    if (heroUrl) {
      var heroEl = document.querySelector('.blk-hero--wordmark');
      if (heroEl) heroEl.style.background = "linear-gradient(to bottom,rgba(13,13,13,0.6) 0%,rgba(13,13,13,0.35) 40%,rgba(13,13,13,0.7) 100%),url('" + heroUrl + "') center/cover no-repeat";
    }
  }
  BlockRenderer.initReveals();
})();
</script>
<script src="/assets/js/components.js"></script>
<script src="/assets/js/tia.js"></script>
</body>
</html>
