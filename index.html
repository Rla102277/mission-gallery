<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Fine art landscape photography by Randy Archambault. Thresholds, passage, and the moment before arrival.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="The Infinite Arch — Fine Art Landscape Photography">
  <meta property="og:description" content="Fine art landscape photography by Randy Archambault. Thresholds, passage, and the moment before arrival.">
  <meta property="og:url" content="https://the-infinite-arch.replit.app/">
  <meta property="og:image" content="https://photos.smugmug.com/The-Platform/i-DHZZ7dn/0/MwNHNVRbhXQmdnfxgsdvB4nftBF2PdsXsWRBnxjr7/XL/Ghost%20Structure-XL.jpg">
  <title>The Infinite Arch — Fine Art Landscape Photography</title>
  <link rel="stylesheet" href="/assets/css/tia.css">
  <link rel="stylesheet" href="/assets/css/blocks.css">
  <style>.page-content { padding-top: 0; }</style>
</head>
<body>
<div class="page-content" id="pageBlocks" data-testid="page-content-home"></div>
<script src="/assets/js/tia-data.js"></script>
<script src="/assets/js/block-renderer.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async function() {
  try {
    var cfRes = await fetch('/api/images/config');
    if (cfRes.ok) { var cfg = await cfRes.json(); if (cfg.hash) TIA.CF_HASH = cfg.hash; }
  } catch(e) {}
  await TIA.load();
  var state = TIA.getState();
  var pageData = state.pages && state.pages['home'];
  var blocks = pageData ? pageData.blocks : BlockRenderer.defaultBlocks('home');
  document.getElementById('pageBlocks').innerHTML = BlockRenderer.render(blocks, state);
  if (pageData && pageData.title) {
    document.title = pageData.title;
    var ogt = document.querySelector('meta[property="og:title"]');
    if (ogt) ogt.content = pageData.title;
  }
  if (pageData && pageData.metaDescription) {
    var md = document.querySelector('meta[name="description"]');
    if (md) md.content = pageData.metaDescription;
    var ogd = document.querySelector('meta[property="og:description"]');
    if (ogd) ogd.content = pageData.metaDescription;
  }
  if (pageData && pageData.ogImage) {
    var ogImg = document.querySelector('meta[property="og:image"]');
    if (ogImg) ogImg.content = TIA.photoUrl(pageData.ogImage, 'hero');
  }
  var ogUrl = document.querySelector('meta[property="og:url"]');
  if (ogUrl) ogUrl.content = window.location.href;
  var heroId = state.home && state.home.hero_bg;
  if (heroId) {
    var heroUrl = TIA.photoUrl(heroId, 'hero');
    if (heroUrl) {
      var heroEl = document.querySelector('.blk-hero--wordmark');
      if (heroEl) heroEl.style.background = "linear-gradient(to bottom,rgba(13,13,13,0.6) 0%,rgba(13,13,13,0.35) 40%,rgba(13,13,13,0.7) 100%),url('" + heroUrl + "') center/cover no-repeat";
    }
  }
  BlockRenderer.initReveals();
});
</script>
<script src="/assets/js/components.js"></script>
<script src="/assets/js/tia.js"></script>
</body>
</html>
