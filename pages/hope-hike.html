<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Infinite Arch — Hope Hike</title>
  <meta name="description" content="Hope Hike — Guadalupe Peak, May 29–31, 2026. A fundraising expedition to the highest point in Texas, combining landscape photography with purpose.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="The Infinite Arch — Hope Hike">
  <meta property="og:description" content="Hope Hike — Guadalupe Peak, May 29–31, 2026. A fundraising expedition combining landscape photography with purpose.">
  <meta property="og:url" content="">
  <meta property="og:image" content="">
  <link rel="stylesheet" href="/assets/css/tia.css">
  <link rel="stylesheet" href="/assets/css/blocks.css">
  <style>.page-content { padding-top: 0; }</style>
</head>
<body>
<div class="page-content" id="pageBlocks" data-testid="page-content-hope-hike"></div>
<script src="/assets/js/tia-data.js"></script>
<script src="/assets/js/block-renderer.js"></script>
<script>
(async function() {
  try {
    var cfRes = await fetch('/api/images/config');
    if (cfRes.ok) { var cfg = await cfRes.json(); if (cfg.hash) TIA.CF_HASH = cfg.hash; }
  } catch(e) {}
  await TIA.load();
  var state = TIA.getState();
  var pageData = state.pages && state.pages['hope-hike'];
  var blocks = pageData ? pageData.blocks : BlockRenderer.defaultBlocks('hope-hike');
  document.getElementById('pageBlocks').innerHTML = BlockRenderer.render(blocks, state);
  if (pageData && pageData.title) {
    document.title = pageData.title;
    var ogt = document.querySelector('meta[property="og:title"]');
    if (ogt) ogt.content = pageData.title;
  }
  if (pageData && pageData.metaDescription) {
    var md = document.querySelector('meta[name="description"]');
    if (md) md.content = pageData.metaDescription;
    var ogd = document.querySelector('meta[property="og:description"]');
    if (ogd) ogd.content = pageData.metaDescription;
  }
  if (pageData && pageData.ogImage) {
    var ogImg = document.querySelector('meta[property="og:image"]');
    if (ogImg) ogImg.content = TIA.photoUrl(pageData.ogImage, 'hero');
  }
  var ogUrl = document.querySelector('meta[property="og:url"]');
  if (ogUrl) ogUrl.content = window.location.href;
  BlockRenderer.initReveals();
})();
</script>
<script src="/assets/js/components.js"></script>
<script src="/assets/js/tia.js"></script>
</body>
</html>
