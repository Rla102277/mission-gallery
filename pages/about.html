<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Infinite Arch — Artist Statement</title>
  <meta name="description" content="Artist statement by Randy Allen. Fine art landscape photography as contemplation.">
  <link rel="stylesheet" href="/assets/css/tia.css">
  <link rel="stylesheet" href="/assets/css/blocks.css">
</head>
<body>
<div class="page-content" id="pageBlocks" data-testid="page-content-about"></div>
<script src="/assets/js/tia-data.js"></script>
<script src="/assets/js/block-renderer.js"></script>
<script>
(async function() {
  try {
    var cfRes = await fetch('/api/images/config');
    if (cfRes.ok) { var cfg = await cfRes.json(); if (cfg.hash) TIA.CF_HASH = cfg.hash; }
  } catch(e) {}
  await TIA.load();
  var state = TIA.getState();
  var pageData = state.pages && state.pages['about'];
  var blocks = pageData ? pageData.blocks : BlockRenderer.defaultBlocks('about');
  document.getElementById('pageBlocks').innerHTML = BlockRenderer.render(blocks, state);
  if (pageData && pageData.title) document.title = pageData.title;
  BlockRenderer.initReveals();
})();
</script>
<script src="/assets/js/components.js"></script>
<script src="/assets/js/tia.js"></script>
</body>
</html>
