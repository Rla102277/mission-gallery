<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Create Account — The Infinite Arch</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px 18px;background:#f5f0e8;color:#0d0d0d;font-family:Georgia,'Times New Roman',serif}
    main{width:min(100%,440px)}
    .brand{display:block;margin-bottom:22px;text-align:center;color:#8a6d17;font:11px/1.4 Arial,sans-serif;letter-spacing:.34em;text-decoration:none;text-transform:uppercase}
    #clerk-auth{min-height:520px}
    .error{padding:24px;border:1px solid #d5cfc3;background:#faf7f0;text-align:center;line-height:1.6}
  </style>
</head>
<body>
  <main>
    <a class="brand" href="/">The Infinite Arch</a>
    <div id="clerk-auth" data-testid="clerk-sign-up"></div>
  </main>
  <script src="/assets/js/clerk-auth.js"></script>
  <script>
    TIAClerk.mountSignUp(document.getElementById("clerk-auth")).catch(function (error) {
      document.getElementById("clerk-auth").innerHTML =
        '<p class="error">Account creation could not be loaded. Please refresh and try again.</p>';
      console.error(error);
    });
  </script>
</body>
</html>
