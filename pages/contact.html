<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Infinite Arch — Contact</title>
  <meta name="description" content="Get in touch with Randy Allen, fine art landscape photographer. Inquiries about prints, collaborations, and commissions.">
  <link rel="stylesheet" href="/assets/css/tia.css">
  <style>
    .page-content { padding-top: 0; }

    .cs-hero {
      height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      position: relative; padding: 0 40px; overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 30%, rgba(201,162,39,0.04) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 70%, rgba(30,50,90,0.2) 0%, transparent 50%),
        linear-gradient(160deg, #080c12 0%, #0d0d0d 40%, #0a0c09 100%);
    }
    .cs-hero::after {
      content:''; position:absolute; left:0; right:0; top:45%; height:1px;
      background:linear-gradient(to right,transparent,rgba(201,162,39,0.06),rgba(245,240,232,0.04),rgba(201,162,39,0.06),transparent);
      pointer-events:none;
    }

    .cs-eyebrow {
      font-size: 9px; letter-spacing: 7px; text-transform: uppercase;
      opacity: 0.22; margin-bottom: 32px;
    }
    .cs-title {
      font-family: var(--font-display); font-weight: 900;
      font-size: clamp(56px, 9vw, 110px); letter-spacing: -4px;
      line-height: 0.88; margin-bottom: 20px;
    }
    .cs-rule {
      width: 60px; height: 1px;
      background: linear-gradient(to right, transparent, var(--gold), transparent);
      margin: 24px auto;
    }
    .cs-sub {
      font-family: var(--font-display); font-style: italic;
      font-size: clamp(17px, 2.5vw, 24px); opacity: 0.5;
      letter-spacing: 3px; margin-bottom: 16px;
    }
    .cs-body {
      font-size: 15px; line-height: 1.9; opacity: 0.35;
      max-width: 440px; margin: 0 auto 40px;
    }

    .cs-email {
      display: inline-flex; align-items: center; gap: 16px;
      font-family: var(--font-body); font-size: 11px;
      letter-spacing: 4px; text-transform: uppercase; opacity: 0.5;
      border: 1px solid var(--rule-dark); padding: 14px 32px;
      transition: all 0.4s;
    }
    .cs-email:hover { opacity: 0.9; border-color: var(--gold); }

    .cs-back {
      position: absolute; bottom: 48px;
      font-size: 9px; letter-spacing: 5px; text-transform: uppercase;
      opacity: 0.2; display: flex; align-items: center; gap: 12px;
      transition: opacity 0.3s;
    }
    .cs-back:hover { opacity: 0.6; }
    .cs-back-line { width: 28px; height: 1px; background: var(--cream); transition: width 0.4s; }
    .cs-back:hover .cs-back-line { width: 48px; }
  </style>
</head>
<body>
<div class="page-content">
  <section class="cs-hero" data-testid="section-contact-hero">
    <span class="cs-eyebrow" data-testid="text-contact-eyebrow">The Infinite Arch</span>
    <h1 class="cs-title" data-testid="text-contact-title">Contact</h1>
    <div class="cs-rule"></div>
    <p class="cs-sub" data-testid="text-contact-subtitle">Let's talk about light</p>
    <p class="cs-body" data-testid="text-contact-body">For print inquiries, collaboration proposals, licensing, or simply to say hello — reach out below.</p>
    <a href="mailto:hello@theinfinitearch.com" class="cs-email" data-testid="link-email">
      hello@theinfinitearch.com
    </a>
    <a href="/" class="cs-back" data-testid="link-back-home">
      <div class="cs-back-line"></div>
      Return Home
    </a>
  </section>
</div>
<script src="/assets/js/components.js"></script>
<script src="/assets/js/tia.js"></script>
</body>
</html>
